# A pull request into next, labelled automerge (or tflplanner-check for a
# pair PR merged by hand): tflplanner's next (or the pair's own pull
# request, `pair: ichirio/tflplanner#<n>` in the body), its full suite, with
# this pull request's tflspec installed. It replaces running tflplanner's
# tests on a local PC before a tflspec change goes in (the user's decision
# of 2026-11-22: the full regression once in CI before the merge, only the
# changed area locally).
on:
  pull_request:
    branches: [next]
    types: [opened, synchronize, reopened, labeled]

name: tflplanner-suite

permissions:
  contents: read

jobs:
  tests:
    # a label event runs only for the two labels (another label starts no
    # run); other events, when the pull request has one of them already
    if: >-
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'automerge' || github.event.label.name == 'tflplanner-check')) ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'automerge') ||
        contains(github.event.pull_request.labels.*.name, 'tflplanner-check')))
    runs-on: ubuntu-latest
    # (named tests...: automerge.sh asks for the head's tests runs)
    name: "tests: tflplanner with this tflspec"
    # (in the job, not the workflow: a run whose job is skipped cancels nothing)
    concurrency:
      group: tflplanner-suite-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          path: tflspec

      # a pair (tflplanner's code changes too): the PR body says
      # `pair: ichirio/tflplanner#<n>`, and that pull request's head is
      # tested; otherwise tflplanner's next
      - name: Which tflplanner
        id: pair
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          n=$(printf '%s' "$BODY" | grep -oE 'pair: *ichirio/tflplanner#[0-9]+' | head -n 1 | grep -oE '[0-9]+$' || true)
          if [ -n "$n" ]; then echo "ref=refs/pull/$n/head" >> "$GITHUB_OUTPUT"; else echo "ref=next" >> "$GITHUB_OUTPUT"; fi
          echo "tflplanner: ${n:+pull request #$n}${n:-next}"

      - uses: actions/checkout@v4
        with:
          repository: ichirio/tflplanner
          ref: ${{ steps.pair.outputs.ref }}
          path: tflplanner

      - name: The tflplanner tested
        run: git -C tflplanner log -1 --format='tflplanner %H %s'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # tflplanner's own dependencies, as its DESCRIPTION says them (its
      # Remotes name tflspec@next); this pull request's tflspec goes in after
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: tflplanner
          extra-packages: any::testthat
          needs: check

      - name: Install this tflspec, then tflplanner
        run: |
          R CMD INSTALL --no-docs --no-multiarch tflspec
          R CMD INSTALL --no-docs --no-multiarch tflplanner

      # (as tflplanner's own full run, R-CMD-check.yaml "Tests (all)")
      - name: tflplanner's tests
        working-directory: tflplanner
        env:
          TESTTHAT_CPUS: 4
          TFLPLANNER_QUICK: false
        shell: Rscript {0}
        run: |
          options(Ncpus = 4L)
          testthat::set_max_fails(Inf)
          cat("tflspec", as.character(packageVersion("tflspec")), "from this pull request\n")
          library(tflplanner)
          testthat::test_dir("tests/testthat", package = "tflplanner", load_package = "installed",
                             reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                             stop_on_failure = TRUE)
