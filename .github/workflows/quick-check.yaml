# A pull request into next: one quick job -- the package installed and its
# tests run, on ubuntu with R release and with the oldest R DESCRIPTION
# allows (`Depends: R (>= x.y)`, read from DESCRIPTION by the r-oldest job);
# no --as-cran, no other platforms, no pkgdown -- so that next does not queue
# behind the full matrix.  (The oldest R: a function or argument newer than
# it, such as tools::md5sum(bytes =) of R 4.5, fails there before the merge.)
# It runs only when the pull request is ready to go in: labelled automerge,
# or tflplanner-check (a pair PR merged by hand). The full R-CMD-check
# runs on pull requests into main (next going into main).
on:
  pull_request:
    branches: [next]
    types: [opened, synchronize, reopened, labeled]

name: quick-check

permissions:
  contents: read

jobs:
  # The oldest R DESCRIPTION allows, for the tests job below (one copy of
  # it: DESCRIPTION's).  Gated as the tests are.
  r-oldest:
    if: >-
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'automerge' || github.event.label.name == 'tflplanner-check')) ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'automerge') ||
        contains(github.event.pull_request.labels.*.name, 'tflplanner-check')))
    runs-on: ubuntu-latest
    name: oldest R (from DESCRIPTION)
    outputs:
      r: ${{ steps.r.outputs.r }}
    steps:
      - uses: actions/checkout@v4

      - name: Depends R (>= x.y)
        id: r
        shell: bash
        run: |
          r=$(tr -d '\r' < DESCRIPTION | grep -oE '(^|[ ,])R \(>= *[0-9.]+\)' | head -n 1 | grep -oE '[0-9.]+' || true)
          if [ -z "$r" ]; then echo "::error::No 'R (>= x.y)' in DESCRIPTION"; exit 1; fi
          echo "oldest R: $r"
          echo "r=$r" >> "$GITHUB_OUTPUT"

  tests:
    needs: r-oldest
    # only a pull request labelled automerge or tflplanner-check (the user,
    # 2026-11-22: CI runs when a PR is ready to go in); a label event, only
    # for those labels
    if: >-
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'automerge' || github.event.label.name == 'tflplanner-check')) ||
      (github.event.action != 'labeled' &&
       (contains(github.event.pull_request.labels.*.name, 'automerge') ||
        contains(github.event.pull_request.labels.*.name, 'tflplanner-check')))
    runs-on: ubuntu-latest
    # (the release job keeps its name: tests (ubuntu-latest, R release))
    name: tests (ubuntu-latest, R ${{ matrix.r == 'oldest' && needs.r-oldest.outputs.r || 'release' }})
    # a newer push to the same pull request cancels the run still going (in
    # the job: a run whose job is skipped cancels nothing); one group per R
    concurrency:
      group: quick-check-${{ github.event.pull_request.number }}-${{ matrix.r }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        # oldest: DESCRIPTION's Depends R, from the r-oldest job
        r: [release, oldest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r == 'oldest' && needs.r-oldest.outputs.r || 'release' }}
          use-public-rspm: true

      # On the oldest R, a suggested package that cannot be installed on it
      # (its current version, or one it needs, wants a newer R) is left out,
      # as in R-CMD-check.yaml's oldest row: car (what it needs wants a newer
      # R); its tests skip there (skip_if_not_installed("car")).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            ${{ matrix.r == 'oldest' && 'car=?ignore-before-r=4.5.0' || '' }}
          needs: check

      - name: The R tested
        shell: Rscript {0}
        run: cat(R.version.string, "\n")

      - name: Install the package
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Tests
        shell: Rscript {0}
        run: |
          pkg <- read.dcf("DESCRIPTION", fields = "Package")[1L, 1L]
          library(pkg, character.only = TRUE)
          testthat::test_dir("tests/testthat", package = pkg, load_package = "installed",
                             reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                             stop_on_failure = TRUE)
