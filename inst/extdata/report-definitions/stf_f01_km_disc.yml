# FDA STF Figure 1 as a report definition: the report type km_cumulative
# (the cumulative percentage, 1 - S(t), with CI bars, the number at risk
# and the log-rank p-value), the data step (ADTTE's TTDISC, in weeks) and
# its labels.  It follows the shape of a figure in FDA's Standard Safety
# Tables and Figures Integrated Guide (version 2); it is not endorsed or
# recommended by FDA.  A study without TTDISC in ADTTE: `data: ADSL`,
# `param: ~`, `time: TRTDURD` and `event: EOTSTT == "DISCONTINUED"`.
id: F-STF-01
kind: figure
label: Kaplan-Meier Plot of Time to Permanent Discontinuation of Treatment, Safety Population
population: SAF
extends: defaults
template:
  name: km_cumulative
  args:
    param: TTDISC
    by: TRT01A
    time_unit: weeks
    x_label: Time (Weeks)
    y_label: Cumulative Percentage of Subjects Discontinued
