# FDA STF Figure 4 as a report definition: the report type km_cumulative
# (the cumulative percentage, 1 - S(t), with CI bars, the number at risk
# and the log-rank p-value) on ADTTE's parameter of the time to the
# first AE of interest (here TTSAE).
# It follows the shape of a figure in FDA's Standard Safety Tables and
# Figures Integrated Guide (version 2); it is not endorsed or recommended
# by FDA.
# The data stage is the report's own `data:` steps: ADTTE read, the
# safety population's subjects kept (a semi join on ADSL, as data.yml's
# SAF says), the parameter; the template's call converts the time (days)
# to `time_unit` and fits the curves.
id: F-STF-04
kind: figure
label: Kaplan-Meier Plot of Time to Onset of the Adverse Event of Interest, Safety Population
population: SAF
extends: defaults
data:
  steps:
    - {step: read, dataset: ADTTE}
    - {step: join, dataset: ADSL, where: SAFFL == "Y", by: USUBJID, how: semi}
    - {step: param, value: TTSAE}
template:
  name: km_cumulative
  args:
    by: TRT01A
    time_unit: weeks
    x_label: Time (Weeks)
    y_label: Cumulative Percentage of Subjects With the Event
