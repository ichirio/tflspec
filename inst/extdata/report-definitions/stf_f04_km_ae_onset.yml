# FDA STF Figure 4 as a report definition: the report type km_cumulative
# (the cumulative percentage, 1 - S(t), with CI bars, the number at risk
# and the log-rank p-value), the data step (ADTTE's parameter of the time
# to the first AE of interest, here TTSAE, in weeks) and its labels.  It
# follows the shape of a figure in FDA's Standard Safety Tables and Figures
# Integrated Guide (version 2); it is not endorsed or recommended by FDA.
id: F-STF-04
kind: figure
label: Kaplan-Meier Plot of Time to Onset of the Adverse Event of Interest, Safety Population
population: SAF
extends: defaults
template:
  name: km_cumulative
  args:
    param: TTSAE
    by: TRT01A
    time_unit: weeks
    x_label: Time (Weeks)
    y_label: Cumulative Percentage of Subjects With the Event
