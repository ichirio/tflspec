# One report of a study: spec/outputs/<id>.yml (tflspec's YAML spec, stage 0 fixture).
# The sample study's T-14-1-1 (demographics), as the sheets of
# inst/sample/SAMPLE-01/spec/table_spec.xlsx say it.
id: T-14-1-1
kind: table
label: Demographics
population: SAF
extends: [defaults]
data:
  source: ard
  analysis_data:
    - id: adsl_saf
      from: ADSL
      population: SAF
  analyses:
    - id: GROUPN
      method: cards::ard_tabulate
      data: adsl_saf
      variables: [TRT01A]
    - id: CONT
      method: cards::ard_summary
      data: adsl_saf
      by: [TRT01A]
      variables: [AGE]
      statistic: {AGE: [N, mean, sd, median, min, max]}
    - id: CAT
      method: cards::ard_tabulate
      data: adsl_saf
      by: [TRT01A]
      variables: [AGEGR1, SEX, RACE, ETHNIC]
codelists:
  TRT01A:
    - {value: Placebo, label: Placebo}
    - {value: Xanomeline Low Dose, label: Low Dose}
    - {value: Xanomeline High Dose, label: High Dose}
content:
  - table_plan: {cols: TRT01A, rows: {group: variable}}
  - plan_labels: {AGE: "Age (years)", AGEGR1: "Age group, n (%)", SEX: "Sex, n (%)", RACE: "Race, n (%)", ETHNIC: "Ethnicity, n (%)"}
  - plan_cells:
      continuous:
        n: "{N}"
        Mean (SD): "{mean} ({sd})"
        Median: "{median}"
        Min, Max: "{min}, {max}"
  - plan_digits: {continuous: {N: 0, mean: 1, sd: 2, median: 1, min: 0, max: 0}}
  - plan_paginate_rows: {max_rows: 30, split: group_safe}
  - plan_cell_style: {where: !r "p > 0.5", bold: true}
page:
  titles:
    1: {center: Table 14.1.1}
    2: {center: Demographic Characteristics}
  footnotes:
    1: {left: "SD = Standard Deviation."}
  tokens: {OUTPUT_POPULATION: Safety Analysis Set}
