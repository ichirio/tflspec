# The sample study (tflspec's YAML spec, stage 0 fixture): its tokens.  The page of
# its reports is the built-in configuration tfl_standard (tfl_styles()).
spec_version: 2
tokens: {COMPANY: Sample Pharma, STATUS: DRAFT, ANALYSIS_TYPE: Final Analysis}
# study$adam gets the levels of defaults.yml's adam_meta (a define.xml's)
settings: {adam_levels: define_xml}
