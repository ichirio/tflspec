# A study's defaults: spec/defaults.yml (tflspec's YAML spec, stage 0 fixture).
# What every report starts from, in the same shape as a report file; a
# report's own file says only what differs (extends: [defaults]).
content:
  - plan_cells: {categorical: "{n:.0f} ({p:.1f%})"}
  - plan_blanks: {where: between_groups, first: true, last: true, counted: true}
  - plan_stub: {name: row_label, before: true}
  - plan_col_header:
      lines:
        1: {row_label: ~, .values: "{col}"}
        2: {row_label: Characteristic, .values: "(N={n})"}
  - plan_style: {border: {fn: rtf_border, args: {top: single, bottom: single}}}
page:
  header:
    1: {left: "Sample Pharma (tflplanner sample)", right: DRAFT}
    2: {left: "Protocol: {STUDY_ID}", right: "Page {PAGE} of {TOTAL_PAGES}"}
    4: {center: "{OUTPUT_LABEL}"}
    5: {center: "{OUTPUT_TITLE}"}
    6: {center: "<{OUTPUT_POPULATION}>"}
  footer:
    1: {left: "{PROGRAM}", right: "{DATETIME}"}
  tokens: {COMPANY: Sample Pharma, ANALYSIS_TYPE: Final Analysis}
  rtf_tables: {auto_section: true}
