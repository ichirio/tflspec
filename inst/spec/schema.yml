    angle: {type: number, description: "Degrees; -45 (the default) rises to the right."}
    font: {type: string}
    width_in: {type: number}
    height_in: {type: number}

rtf_tables:
  package: rtfreporter
  description: A table's or a listing's pages in the document.
  args:
    auto_section: {type: logical}
    section_label_align: {type: "enum[left|center|right]"}
    auto_title: {type: logical}
    title_label_align: {type: "enum[left|center|right]"}
    font_size_half_points: {type: integer}
    page_break: {type: logical, description: "FALSE: on under the content before it in the document, on the page that one ends on."}
    space_before: {type: integer, description: "With page_break false, empty lines between the content before and this one."}
    first_rows: {type: integer, description: "With page_break false, the table's rows on the page before it; the rest on pages of their own."}
    cont_title: {type: string, description: "With first_rows, a line under the title of each page after the shared one."}
    read_attributes: {type: logical, description: "FALSE: what the table carries itself (its rtf_blank_rows attribute) is not read; blank: TRUE."}

rtf_figures:
  package: rtfreporter
  description: A figure in the document, its size in twips (an inch is 1440), or fit (the page's body).
  args:
    width_twips: {type: "integer|enum[fit]"}
    height_twips: {type: "integer|enum[fit]"}
    align: {type: "enum[left|center|right]"}
