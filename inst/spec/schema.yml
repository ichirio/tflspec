  - sheet: col_header
    description: 'Table: one row a header cell (plan_col_header(header = )). A report''s
      own cells replace the default header whole.'
    columns:
      - column: line
        description: The header row, a whole number (1 = the top).
        example: '1'
      - column: cols
        description: 'The columns the cell sits on: a name, .values (every value column),
          a position or range (3, 3:31, 3:last), or KEY = value (the columns whose
          key has that value); | between them.'
        example: .values
      - column: span
        description: 'Blank: one cell over cols; each: one cell a column; a key''s
