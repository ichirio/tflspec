    height_in: {type: number}
    margin_top_in: {type: number}
    margin_bottom_in: {type: number}
    margin_left_in: {type: number}
    margin_right_in: {type: number}
    header_dist_in: {type: number}
    footer_dist_in: {type: number}

rtf_default_format:
