    layout: {type: string}
    wrap: {type: "logical|string"}
    align: {type: "enum[left|center|right]", description: "The alignment of the columns that set none of their own (listing_col(align = ))."}
    record: {type: "logical|string", description: "The hidden record column: false for none, a string its name; true (the default) the standard one."}

listing_col:
  package: rtfreporter
  description: One column of a listing.
  args:
    vars: {type: "list<column>", description: "The variable(s) the column prints; several stack (or flow) in one cell."}
    sep: {type: string}
    width: {type: number}
    label: {type: string}
    name: {type: string}
    rel_width: {type: number}
    align: {type: "enum[left|center|right]"}
    layout: {type: "enum[stack|flow]"}
    collapse_repeats: {type: logical}

plan_titles:
  package: rtfreporter
  rank: 240
  stage: finishing
  tier: other
  dots: {style: positional, key: titles, type: "list<string>"}
  args:
    pages: {type: "list<string>"}

plan_footnotes:
  package: rtfreporter
  rank: 250
  stage: finishing
  tier: other
  dots: {style: positional, key: footnotes, type: "list<string>"}
  args:
    pages: {type: "list<string>"}

plan_after:
  package: rtfreporter
  rank: 260
  stage: finishing
  tier: other
  dots: {style: positional, key: steps, type: "list<r>"}

rtf_border:
  package: rtfreporter
  args:
    top: {type: "logical|string"}
    bottom: {type: "logical|string"}
    left: {type: "logical|string"}
    right: {type: "logical|string"}

normalize_ard:
  package: rtfreporter
  rank: 10
  stage: mapping
  tier: required
  description: The ARD flattened -- groups and hierarchy as key columns -- before the plan.
  args:
    keys: {label: "Keys", help: "The group variables made into columns of their own (TRT01A, SEX ...). Blank: every group of the ARD, which is what a table usually needs. e.g. TRT01A", type: "list<column>"}
    hierarchy: {label: "Hierarchy", help: "The nested row keys, outermost first: each level's own summary rows become its rows (a SOC's row over its PTs). Blank: step 1's hierarchical analysis's, which is usually right; another may not match the ARD. e.g. AEBODSYS, AEDECOD", type: "list<column>"}
    overall: {main: true, label: "Overall row", help: "The text of the row a hierarchical analysis makes over all its terms (the subjects with any event), put on the first hierarchy column. Blank: that row is left as it is. e.g. Any TEAE", type: string}
    drop_contexts: {label: "Contexts dropped", help: "The kinds of ARD rows (context) left out before the table. Blank: the attributes rows and the total_n row, which no cell prints (the total N is still kept for a header). e.g. attributes", type: "list<string>"}
    drop_key_variables: {label: "Drop the key variables", help: "The rows that count a group variable itself (the subjects per arm): TRUE takes them out; blank (FALSE) keeps them out of the body for a header's (N=n). Usually left blank. e.g. TRUE", type: logical}
    stack: {main: true, label: "Stacked analyses", help: "Stacks parallel subgroup analyses (ALL, SEX, AGEGR1 ...) as one pair of keys, subgroup and subgroup_level, for a subgroup table. e.g. subgroup = ALL, SEX, AGEGR1", type: "map<string, list<column>|string>"}
    stack_sep: {label: "Stack separator", help: "The text between a crossed layer's names and values (\" / \": AGEGR1 / SEX). e.g. \" x \"", type: string}
    stack_nest: {label: "Nest the stack", help: "TRUE: a crossed layer's outer value goes to subgroup_outer (Age Group by Sex, 65-80, F as three levels). e.g. TRUE", type: logical}

rtf_col_header:
  package: rtfreporter
  description: A column header written row by row.
  dots: {style: positional, key: rows, type: "list<list<string>|vec<string, string>>", description: "The header's rows, top first: each a sequence of texts, or a map of a cell's columns to its text."}

cell_rows:
  package: rtfreporter
  dots: {style: named, type: "template|list<guard|template>", description: "A cell's lines, by the label of the row each sits on."}

# ---- the ARD's analyses: cards and cardx calls -------------------------------
# One analysis of a spec's `ard.analyses` is one of these calls.  `data` is
# the analysis data the spec names (`data: adsl_saf`), not an argument here.
# A tidyselect argument (`variables`, `by`) is a column or a sequence of
# them; `statistic`, `fmt_fun` and `stat_label` are maps by variable (the
# list form cards takes), or `!r` for a selector formula
# (`!r "everything() ~ continuous_summary_fns()"`).

ard_summary:
  package: cards
  description: Summary statistics of continuous variables.
  args:
    variables: {type: "list<column>|column"}
    by: {type: "list<column>|column"}
    strata: {type: "list<column>|column"}
    statistic: {type: "map<column, call<continuous_summary_fns>>|r", description: "The statistics by variable, each a function list: {AGE: {fn: cards::continuous_summary_fns, args: {summaries: [N, mean, sd]}}}, or !r for a formula."}
    fmt_fun: {type: "map<column, map<stat, integer>>|r", description: "Digits by variable and statistic: {AGE: {mean: 1, sd: 2}}."}
    stat_label: {type: "map<column, map<stat, string>>|r"}

ard_tabulate:
  package: cards
  description: Counts and percentages of categorical variables.
  args:
    variables: {type: "list<column>|column"}
    by: {type: "list<column>|column"}
    strata: {type: "list<column>|column"}
    statistic: {type: "map<column, list<stat>>|r"}
    denominator: {type: "string|r", description: "\"column\", \"row\", \"cell\", or the data of the population (`!r adsl`)."}
    fmt_fun: {type: "map<column, map<stat, integer>>|r"}
    stat_label: {type: "map<column, map<stat, string>>|r"}

ard_tabulate_value:
  package: cards
  description: Counts of one value of each variable (a flag's "Y").
  args:
    variables: {type: "list<column>|column"}
    by: {type: "list<column>|column"}
    strata: {type: "list<column>|column"}
    value: {type: "map<column, string|logical|number>|r"}
    statistic: {type: "map<column, list<stat>>|r"}
    denominator: {type: "string|r"}
    fmt_fun: {type: "map<column, map<stat, integer>>|r"}
    stat_label: {type: "map<column, map<stat, string>>|r"}

ard_hierarchical:
  package: cards
  description: Counts in a hierarchy (SOC and PT).
  args:
    variables: {type: "list<column>"}
    by: {type: "list<column>|column"}
    statistic: {type: "map<column, list<stat>>|r"}
    denominator: {type: "string|r"}
    id: {type: column}
    fmt_fun: {type: "map<column, map<stat, integer>>|r"}
    stat_label: {type: "map<column, map<stat, string>>|r"}

ard_stack_hierarchical:
  package: cards
  description: Counts in a hierarchy, each level's own and the overall rows.
  args:
    variables: {type: "list<column>"}
    by: {type: "list<column>|column"}
    id: {type: column}
    denominator: {type: "r|string"}
    include: {type: "list<column>"}
    statistic: {type: "map<column, list<stat>>|r"}
    overall: {type: logical}
    over_variables: {type: logical}
    attributes: {type: logical}
    total_n: {type: logical}
    shuffle: {type: logical}

continuous_summary_fns:
  package: cards
  description: The summary functions of ard_summary(), by their names.
  args:
    summaries: {type: "list<stat>"}

ard_missing:
  package: cards
  args:
    variables: {type: "list<column>|column"}
    by: {type: "list<column>|column"}
    statistic: {type: "map<column, list<stat>>|r"}

ard_total_n:
  package: cards
  description: The number of subjects in the data.

ard_stack:
  package: cards
  description: Several analyses stacked, by the same `by`, with the overall rows.
  dots: {style: positional, key: analyses, type: "list<call>", description: "The analyses, each a cards call without its data."}
  args:
    .by: {type: "list<column>|column"}
    .overall: {type: logical}
    .missing: {type: logical}
    .attributes: {type: logical}
    .total_n: {type: logical}
    .shuffle: {type: logical}

ard_strata:
  package: cards
  description: One analysis repeated within each level of the strata.
  args:
    .by: {type: "list<column>|column"}
    .strata: {type: "list<column>|column"}
    .f: {type: "r|call"}

ard_categorical_ci:
  package: cardx
  description: A proportion's confidence interval.
  args:
    variables: {type: "list<column>|column"}
    by: {type: "list<column>|column"}
    strata: {type: "list<column>|column"}
    method: {type: "enum[waldcc|wald|clopper-pearson|wilson|wilsoncc|strat_wilson|strat_wilsoncc|agresti-coull|jeffreys]"}
    denominator: {type: "string|r"}
    conf.level: {type: number}
    value: {type: "map<column, string|logical|number>|r"}

ard_stats_t_test:
  package: cardx
  args:
    variables: {type: "list<column>|column"}
    by: {type: column}
    conf.level: {type: number}

ard_stats_wilcox_test:
  package: cardx
  args:
    variables: {type: "list<column>|column"}
    by: {type: column}
    conf.level: {type: number}

ard_stats_chisq_test:
  package: cardx
  args:
    variables: {type: "list<column>|column"}
    by: {type: column}

ard_stats_fisher_test:
  package: cardx
  args:
    variables: {type: "list<column>|column"}
    by: {type: column}
    conf.level: {type: number}

ard_stats_kruskal_test:
  package: cardx
  args:
    variables: {type: "list<column>|column"}
    by: {type: column}

ard_stats_oneway_test:
  package: cardx
  args:
    formula: {type: r}

# ---- a report's page: the document's calls -----------------------------------
# A report's `page:` says each of these by its name, its arguments a map
# (`rtf_page: {orientation: portrait}`); the lines of `header`, `footer`,
# `titles` and `footnotes` and the `tokens` are page:'s own keys.

rtf_page:
  package: rtfreporter
  description: The page -- paper, orientation, margins (inches).
  args:
    paper_size: {type: "enum[letter|legal|A4|A3|A5]"}
    orientation: {type: "enum[landscape|portrait]"}
    width_in: {type: number}
    height_in: {type: number}
    margin_top_in: {type: number}
    margin_bottom_in: {type: number}
    margin_left_in: {type: number}
    margin_right_in: {type: number}
    header_dist_in: {type: number}
    footer_dist_in: {type: number}

rtf_default_format:
