    space_before: {type: integer, description: "With page_break false, empty lines between the content before and this one."}
    render_width: {type: number, description: "A plot object drawn this wide, in inches (rtfplot()'s); blank: rtfplot()'s default."}
    render_height: {type: number, description: "A plot object drawn this high, in inches."}
    render_dpi: {type: number, description: "A plot object drawn at this resolution."}
    png_device: {type: "enum[auto|ragg|png]", description: "The PNG device a plot object is drawn with: auto (ragg when installed), ragg, png."}

rtf_titles:
  package: rtfreporter
