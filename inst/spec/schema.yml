  description: The titles above the content.
  args:
    font_size_half_points: {type: integer}
    row_height_twips: {type: integer}
    markup: {type: "enum[script|relational|all|none]|list<enum[script|relational]>"}
    font: {type: "string|vec<enum[latin|east_asian|complex|hansi], string>"}
    align: {type: "enum[left|center|right]"}

rtf_footnotes:
  package: rtfreporter
  description: The footnotes below the content.
  args:
    font_size_half_points: {type: integer}
    row_height_twips: {type: integer}
    markup: {type: "enum[script|relational|all|none]|list<enum[script|relational]>"}
    font: {type: "string|vec<enum[latin|east_asian|complex|hansi], string>"}
    align: {type: "enum[left|center|right]"}
    border: {type: "call<rtf_border>", description: "The footnotes' border: {fn: rtf_border, args: {top: true}}."}

rtf_header:
  package: rtfreporter
  description: The running header's look (its lines are page.header).
  args:
    border: {type: "call<rtf_border>", description: "The band's border: {fn: rtf_border, args: {top: true}}."}
    width_twips: {type: integer}
    width: {type: "enum[page]|number", description: "page (the writable width), a fraction of it in (0, 1], or twips."}
    row_height_twips: {type: integer}
    font_size_half_points: {type: integer}
    font: {type: "string|vec<enum[latin|east_asian|complex|hansi], string>"}
    markup: {type: "enum[script|relational|all|none]|list<enum[script|relational]>"}
    cell_padding_left_twips: {type: integer}
    cell_padding_right_twips: {type: integer}
    drop_empty_rows: {type: logical, description: "TRUE: a line whose own tokens are all empty is left out."}

rtf_footer:
  package: rtfreporter
  description: The running footer's look (its lines are page.footer).
  args:
    border: {type: "call<rtf_border>", description: "The band's border: {fn: rtf_border, args: {top: true}}."}
    width_twips: {type: integer}
    width: {type: "enum[page]|number", description: "page (the writable width), a fraction of it in (0, 1], or twips."}
    row_height_twips: {type: integer}
    font_size_half_points: {type: integer}
    font: {type: "string|vec<enum[latin|east_asian|complex|hansi], string>"}
    markup: {type: "enum[script|relational|all|none]|list<enum[script|relational]>"}
    cell_padding_left_twips: {type: integer}
    cell_padding_right_twips: {type: integer}
    drop_empty_rows: {type: logical, description: "TRUE: a line whose own tokens are all empty is left out."}

# ---- the spec sheets' columns: the help of each, in the sheets' order -------
# What tfl_spec_columns() returns (the xlsx's header comments, the GUI's ?,
# the AI kit): a sheet's own description, then its columns.  A column that
# is an argument of a function says which (`at: rtf_page.paper_size`): the
# help of that argument in the YAML spec is the same text (tfl_schema_help()).
.sheets:
  - sheet: (workbook)
    description: 'A tflspec workbook: one sheet per grain. Sheets whose name starts
      with _ are not read (notes). Each column is described on its header cell''s
      comment and by tfl_spec_columns().'
    columns:
      - column: output_id
        description: 'The report a row belongs to. Blank: a study-wide default; a
          row naming a report replaces the default row with the same key (ARD analyses:
          the report the analysis serves).'
        example: T-14-1-1
      - column: note
        description: A column for people, on any sheet; never read. Any other column
          a sheet does not read is an error (a mistyped header).
      - column: (list)
        description: 'Several values in one cell: | between them.'
        example: TRT01A | SEX
      - column: (tokens)
        description: 'In titles, footnotes, header and footer cells: {PAGE} {TOTAL_PAGES}
          {AUTO_PAGE} {AUTO_TOTAL_PAGES} (page numbers), {PROGRAM} {PROGRAM_FULL}
          {PROGRAM_NAME} {PROGRAM_DIR} (the program; {PROGRAM_FULL} its absolute path),
          {DATETIME} {DATETIME:%Y-%m-%d} (the run), the report''s own: {OUTPUT_ID},
          {OUTPUT_LABEL} (Table 14.1.1, made from the ID; the tokens rows OUTPUT_KIND_TABLE
          / _LISTING / _FIGURE change the words), {OUTPUT_TITLE} {OUTPUT_POPULATION}
          {OUTPUT_SECTION} {STUDY_ID} (blank unless the tokens sheet says them; a
          line left with nothing but them is not printed), and your own from the tokens
          sheet ({STUDY} ...).'
  - sheet: study
    description: 'What is one for the whole study: one row a key. Table / report keys:
      rounding, output_path, program_dir. ARD keys: id, output, source. No output_id.'
    columns:
      - column: key
        description: 'The fact: rounding (r: round half to even; sas: round half away
          from zero; blank: options(rtfreporter.rounding)); output_path (the folder
          of the RTF files); program_dir (the folder of the programs, for {PROGRAM});
          ARD: id (the subject key; default USUBJID), output (the study ARD''s file;
          default output/ard/ard.rds), source (R files of the study''s own analysis
          functions, relative to the study folder, | between them).'
        example: rounding
      - column: value
        description: Its value, as text.
        example: sas
  - sheet: about
    description: 'key / value: spec_version (a workbook of a newer version is refused
      by an older tflspec).'
    example: spec_version = 1
    columns:
      - column: key
        description: spec_version.
        example: spec_version
      - column: value
        description: A whole number.
        example: '1'
  - sheet: datasets
    description: 'ARD: the study''s data, one row a dataset.'
    columns:
      - column: dataset
        description: A name for the data, used by populations and analyses (and the
          object's name in the program, in lower case).
        example: ADSL
      - column: level
        description: SDTM or ADaM (for people and ARS; not read by the program).
        example: ADaM
      - column: path
        description: 'Its file, relative to the study folder; the reader follows the
          extension: .rds, .xpt, .sas7bdat, .csv, .parquet.'
        example: data/adam/adsl.xpt
      - column: derive
        description: 'New columns, NAME = R expression, | between them (transform());
          blank: none.'
        example: AGE65 = AGE >= 65
  - sheet: populations
    description: 'ARD: the populations, one row a population.'
    columns:
      - column: population_id
        description: The population's name, used by analyses.
        example: SAF
      - column: dataset
        description: The dataset its subjects come from.
        example: ADSL
      - column: where
        description: 'An R condition on that dataset choosing the subjects; blank:
          every row.'
        example: SAFFL == "Y"
      - column: derive
        description: 'Columns added to the population, NAME = R expression, | between
          them; blank: none.'
        example: TRTA = TRT01A
      - column: label
        description: 'The population as a header or footnote prints it, and its name
          in CDISC ARS; blank: the population_id.'
        example: Safety Analysis Set
  - sheet: analysis_data
    description: 'ARD: named data the analyses read (the study''s, one row a data):
      from a dataset or an analysis data above it, the subjects of a population, the
      records a condition keeps, columns of the population added, columns derived,
      one row per set of values. In that order. An analysis names one in `data`, or
      as its `denominator`.'
    columns:
      - column: data_id
        description: 'The data''s name, and its object''s name in the ARD program:
          a lower-case letter first, then letters, digits, _ or . -- not a dataset''s,
          pop_<population>''s or another data''s.'
        example: adae_teae
      - column: label
        description: 'A name a person reads; blank: none.'
        example: Treatment-emergent AEs
      - column: from
        description: 'What it is made from: a dataset, or an analysis data of a row
          above.'
        example: ADAE
      - column: population_id
        description: 'Keeps the subjects of this population; blank: no restriction
          here (made from an analysis data: that one''s population).'
        example: SAF
      - column: subjects
        description: 'Keeps the subjects of an analysis data above (a report''s own
          subjects: the safety set in phase 1 ...): the numerator kept to the denominator''s
          subjects. Instead of population_id; blank: no restriction here.'
        example: adsl_saf_p1
      - column: where
        description: 'An R condition on the records (the numerator''s filter); blank:
          every record.'
        example: TRTEMFL == "Y"
      - column: add
        description: 'Columns of the population''s data (its dataset, ADSL) -- or
          of the data of `subjects` -- added by the subject key, | between them; a
          column of the same name is replaced. Needs a population or subjects, here
          or above; blank: none.'
        example: TRT01A | AGEGR1
      - column: derive
        description: 'New columns, NAME = R expression, | between them (transform());
          a column the code lists list becomes a factor in their order; blank: none.'
        example: PHASE = APHASE
      - column: keep
        description: 'The columns kept, | between them (the subject key always); with
          derive, what transmute() does; blank: every column.'
        example: TRT01A | AEBODSYS | AEDECOD
      - column: distinct
        description: 'One row for each set of values of these columns, | between them
          (dplyr::distinct(), the first row kept): a denominator per subject and phase;
          blank: every row.'
        example: USUBJID | APHASE
      - column: code
        description: 'R that makes the data itself, when the columns cannot say it:
          its value is the data; the datasets (adae), pop_<population> and the analysis
          data above are in reach. With it, the columns but from are left blank; blank:
          the columns make the data.'
        example: dplyr::filter(adae, USUBJID %in% pop_saf$USUBJID, AETOXGR >= 3)
  - sheet: analyses
    description: 'ARD: one analysis a row; each becomes one cards / cardx call in
      the ARD program, its result tagged with output_id, analysis_id and population_id.'
    columns:
      - column: analysis_id
        description: The analysis's id within its report; an ARD column.
        example: AGE
      - column: parent
        description: 'The analysis this one runs inside: an analysis of the same report
          whose method is cards::ard_stack (several analyses on the same data and
          by, with the by counts and the total N), cards::ard_strata (within subgroups)
          or cards::ard_pairwise (each pair of groups). It takes the parent''s dataset,
          population_id and where (and in a stack its by), so leave those blank; blank:
          an analysis of its own.'
        example: DEMO
      - column: label
        description: 'A name a person reads (for ARS and the GUI); blank: none.'
        example: Age (years)
      - column: method
        description: 'What is computed: a keyword of tfl_ard_methods() (continuous,
          categorical, hierarchical ...), any pkg::function (cards::, cardx::), or
          a function of the study''s own that the study key source loads.'
        example: continuous
      - column: data
        description: 'The analysis data analysed (a data_id of analysis_data), instead
          of dataset and population_id: the population is its population; blank: dataset
          and population_id say it.'
        example: adae_teae
      - column: dataset
        description: 'The data analysed; blank: the population''s own dataset. Blank
          when `data` is given.'
        example: ADAE
      - column: population_id
        description: 'The population: the data is restricted to its subjects; blank:
          no restriction (population is NULL), or the population of `data`.'
        example: SAF
      - column: where
        description: 'An R condition on the data, applied after the population (on
          an analysis data: after its own conditions); blank: every row.'
        example: TRTEMFL == "Y"
      - column: by
        description: 'Grouping variables (cards'' by), | between them; blank: none.'
        example: TRT01A
      - column: overall
        description: 'TRUE: the analysis again without its by, over all its subjects
          (cards'' overall rows, no group): what a table shows as its Total column
          (tables$total). On a cards::ard_stack row: .overall = TRUE. Blank: by groups
          only.'
        example: 'TRUE'
      - column: strata
        description: 'Variables the analysis is repeated within (cards'' strata: a
          subgroup, a parameter by visit), | between them; blank: none.'
        example: PARAMCD | AVISIT
      - column: variables
        description: The variables analysed (cards' variables), | between them.
        example: AGE | BMIBL
      - column: optional
        description: 'TRUE: the variables are the ones the data has of them (written
          any_of(); tfl_build_ard() says which it left out), as a template''s default
          list. Blank: every variable must be in the data.'
        example: 'TRUE'
      - column: statistics
        description: 'For continuous / categorical / missing: the statistics computed,
          in order (tfl_ard_statistics()); for other methods: the statistics kept
          of what the method gives; | between them; blank: the method''s default.'
        example: N | mean | sd
      - column: denominator
        description: 'What percentages are of: population (hierarchical and max take
          it anyway), row / column / cell (cards), another population, a dataset (its
          records of the population''s subjects), or an analysis data (as it is: one
          row a subject and phase gives the N of each phase); blank: the method''s
          default.'
        example: row
      - column: formats
        description: 'Display formats, statistic=format, | between them; VAR:statistic=format
          for one variable. xx.x = one decimal (the x''s count only after the point),
          xx.x% = a proportion as a percent, a number = decimals, pvalue = <0.001
          or 3 decimals; blank: the statistic''s default.'
        example: mean=xx.x | p=xx.x%
      - column: args
        description: 'More arguments of the call, as R (data and population are bound),
          in any order; refused if not R. An argument a column gives (by, variables,
          strata, denominator, statistic) may not be given here too; blank: none.'
        example: over_variables = TRUE
      - column: post
        description: 'Steps on the ARD after the call, each a call with the ARD left
          out, | between them: cards::add_calculated_row() (a statistic computed from
          others), cards::filter_ard_hierarchical() (only the rows that pass), cards::sort_ard_hierarchical(),
          cards::diff_ard_hierarchical(), complete_hierarchy() (a code list''s values no
          subject has, counted 0: written with the row''s variables and the code lists''
          `under`), or a function of your own that takes an ARD and gives one; blank:
          none.'
        example: cards::add_calculated_row(expr = sd / sqrt(N), stat_name = "se")
      - column: code
        description: 'method = custom only: the R code that gives the ARD (data and
          population are bound).'
        example: cards::ard_tabulate(data, variables = SEX)
      - column: purpose
        description: 'For CDISC ARS (tfl_ars()): PRIMARY / SECONDARY / EXPLORATORY
          OUTCOME MEASURE; blank: tfl_ars(purpose = ).'
        example: PRIMARY OUTCOME MEASURE
      - column: reason
        description: 'For CDISC ARS: SPECIFIED IN PROTOCOL / SPECIFIED IN SAP / DATA
          DRIVEN / REQUESTED BY REGULATORY AGENCY; blank: SPECIFIED IN SAP.'
        example: SPECIFIED IN SAP
  - sheet: tables
    description: 'Table: one row a report. Its roles (table_plan()) and the table-wide
      options; a verb written in code afterwards wins.'
    columns:
      - column: cols
        description: The key spread across the columns, outermost first, | between
          them (table_plan(cols = )).
        example: TRTA | SEX
      - column: rows
        description: The keys down the rows (table_plan(rows = )); name = column renames,
          a quoted value is a constant heading; | between them.
        example: group1 = AEBODSYS | grp = "Worst Post-Baseline Values"
      - column: label
        description: 'Where the row label comes from (table_plan(label = )); blank:
          .label; NA: used to tell rows apart, not printed; NULL: not used.'
        example: label = AEDECOD
      - column: stats
        description: 'cells (cells built from templates) or rows (one statistic a
          row, the raw values) (plan_cells(stats = )); blank: cells.'
        example: rows
      - column: value
        description: 'Which of the ARD''s values the table prints: stat (the number,
          rounded here: the digits sheet, a template''s {x:.1f}) or stat_fmt (the
          ARD''s own text, as it was formatted: no digits to set; a template still
          combines them, {mean} ({sd})); a row may say otherwise in its template ({mean:stat_fmt},
          {mean:.1f}). With stats = rows: which goes in the cell (plan_cells(value
          = )). Blank: stat.'
        example: stat
      - column: sep
        description: 'What joins several column keys into a column name (plan_columns(sep
          = )); the columns sheet names value columns with it; blank: ____.'
        example: _
      - column: sort
        description: 'TRUE, FALSE, or the sort keys in order, - in front for descending
          (plan_sort()): a column, .overall, .depth, a statistic (summed over the
          columns), stat[col] for one column (-n[Total]), stat@key for a group''s
          own count carried to its rows (-n@group1: SOCs by their own count); blank:
          the data''s order.'
        example: .overall | -n@group1 | group1 | -n | label
      - column: sort_stat
        description: The statistic totalled across columns for a frequency order (plan_sort(stat
          = )).
        example: 'n'
      - column: na
        description: 'What a cell no template could fill prints (plan_cells(na = ));
          blank: empty.'
        example: '-'
      - column: header_n
        description: 'Which population {n} in the column header is, for a table split
          by page (a lab parameter): page (those with that page''s data), table (the
          population), or both as n = page | N = table for {n} and {N}; blank: page
          (warns when both exist and differ). Both must be in the ARD.'
        example: n = page | N = table
      - column: total
        description: 'The heading of a Total column (plan_total()): the ARD''s overall
          rows, its analyses run again without their by (analyses$overall), as one
          more column; its {n} is the study total. Blank: none.'
        example: Total
      - column: total_position
        description: 'Where the Total column goes among the column key''s values:
          last or first; blank: last.'
        example: first
      - column: overall_label
        description: 'The row of a hierarchy''s overall counts (a hierarchical analysis
          with args over_variables = TRUE) and what it prints: normalize_ard(overall
          = ), written by tfl_normalize_code(). Blank: no such row.'
        example: Subjects with at least one TEAE
      - column: stat_groups
        description: 'One record''s statistics (the same analysis and keys) in named
          groups (plan_stat_groups()): | between groups, a comma between a group''s
          statistics. The key .stat_group then names them in cols (TRT01A | .stat_group:
          N in one column, the rate and CI in the next) or in rows (one group under
          another, in the order said); a cells row''s variable may be a group''s name,
          its template one row or several. The ARD stays as it is: no relabelled variable.
          .variables = RESP limits the groups to those variables, and .others = n
          puts the other variables'' records whole in that group (a subgroup''s own
          n (%) beside its ORR). Blank: none.'
        example: n = N | orr_ci = n, estimate, conf.low, conf.high
      - column: show_keys
        description: 'Row keys the table also shows as variables, | between them:
          their own counts (the subgroup variable tabulated by arm) stay in the body,
          a block of their own beside the subgroup layer of another analysis (table_plan(show_keys
          = )). Blank: none.'
        example: SEX | AGEGR1
      - column: keep_where
        description: 'Rows kept by a condition over the record (plan_filter()): one
          R condition over its statistics and keys, as a cells row''s when (p >= 0.05);
          several joined by &. A SOC stays when one of its PTs does; the overall row
          always stays. Blank: every row.'
        example: p >= 0.05
      - column: keep_any
        description: 'TRUE / FALSE: the condition in any column (TRUE, blank) or every
          column (FALSE) (plan_filter(any = )).'
        example: 'FALSE'
      - column: keep_parents
        description: 'keep (blank): a parent row (a SOC) stays exactly when one of
          its children does; drop: judged by its own counts (plan_filter(parents =
          )).'
        example: drop
      - column: stack
        description: 'Subgroups as one pair of keys: name = its layers, a comma between
          them, * crossing variables (AGEGR1 * SEX), | between several keys; or the
          strata slots (subgroup = group2, group3) (normalize_ard(stack = ), written
          by tfl_normalize_code()). rows then names subgroup and subgroup_level, whatever
          group slot each variable came in. Blank: none.'
        example: subgroup = ALL, SEX, AGEGR1, AGEGR1 * SEX
      - column: stack_sep
        description: 'What joins a crossed layer''s names and levels (AGEGR1 / SEX,
          65-80 / F) (normalize_ard(stack_sep = )). Blank: '' / ''.'
        example: ' x '
      - column: stack_nest
        description: 'TRUE: a crossed layer''s outer levels in a key of their own,
          subgroup_outer, its innermost in subgroup_level, so rows grp = subgroup
          | outer = subgroup_outer | lvl = subgroup_level with a stub prints the outer
          level as a heading (normalize_ard(stack_nest = )). Blank: FALSE.'
        example: 'TRUE'
      - column: compare
        description: 'Comparison columns: their names, | between them (plan_compare()).
          Each reads the ARD''s comparison records (a test''s p-value, a difference
          and its CI: the column key with no value) and puts them on the row of their
          variable; its templates are the cells rows whose variable is the column''s
          name. Blank: none.'
        example: p | diff
      - column: compare_by
        description: 'The column that splits the comparisons into columns, one a level
          (plan_compare(by = )): each active arm against placebo. Blank: one comparison
          a variable.'
        example: COMPARISON
      - column: compare_position
        description: 'Where the comparison columns go: last (blank) or first (plan_compare(position
          = )).'
        example: first
  - sheet: variables
    description: 'Table: one row a variable (an analysis variable, a column key or
      the label column).'
    columns:
      - column: variable
        description: The variable's name.
        example: AGEGR1
      - column: label
        description: 'What prints for its name (plan_labels()); blank: the name.'
        example: Age (years)
      - column: order
        description: 'Its place among the variables (a number); blank: the data''s
          order.'
        example: '1'
      - column: levels
        description: 'Its values in print order, | between them (plan_levels()); blank:
          the data''s order.'
        example: Grade 0 | Grade 1 | Total
      - column: empty_levels
        description: 'Its values no record has -- a code list''s value, counted 0
          in every column -- show (a 0 row) or hide (plan_levels(.drop_empty = ));
          blank: show.'
        example: hide
      - column: under
        description: 'Its rows under one level of another variable: that variable,
          a colon, the level as the table shows it (plan_nest()); after that row,
          one indent deeper, its own heading dropped; blank: its own block.'
        example: 'RACE: Asian'
  - sheet: codelists
    description: 'A report''s code lists, one row a value of a variable -- its place
      and what it is in the data the report''s program makes (the ARD, a listing''s
      or a figure''s data): the program puts them on the columns it reads (cl_<variable>,
      set_levels()), each a factor in the list''s order, its values the labels. A
      value the list does not have stops the program. Every row names its report in
      `output_id` (a blank one is an error: copy the rows into each report that uses
      them). A variable''s `levels` on the variables sheet, when given, is the order
      in the table instead; a variable''s heading is the variables sheet''s `label`.'
    columns:
      - column: variable
        description: The variable (an analysis variable or a column key).
        example: SEX
      - column: value
        description: A value as the data have it.
        example: F
      - column: label
        description: 'What the value is in the data the program makes, and so what
          prints; blank: the value.'
        example: Female
      - column: order
        description: 'Its place among the variable''s values (a number); blank: after
          the numbered ones, in the sheet''s order.'
        example: '2'
      - column: under
        description: 'A nested count''s (SOC / PT) inner value: the value, as the data
          have it, of the variable one level out it sits under, so that complete_hierarchy()
          in the analysis''s `post` shows it with 0 counts when no subject has it; blank:
          none (an outer value is shown without it).'
        example: EYE DISORDERS
  - sheet: cells
    description: 'Table: one row a line of a cell (plan_cells()). Rows with the same
      variable / context / row are one chain, tried top down. With stats = rows, a
      row with no template is one statistic''s digits (plan_digits(.rows = )): row
      = the statistic as the label column prints it.'
    columns:
      - column: variable
        description: 'What the template is for: a variable, continuous / categorical
          (every variable of that kind); blank: every variable.'
        example: continuous
      - column: context
        description: 'Only the ARD rows of this context (one variable summarised two
          ways); blank: any.'
        example: summary
      - column: row
        description: 'The row''s label; blank: one row a level, labelled by the level.'
        example: Mean (SD)
      - column: when
        description: 'An R condition on the statistics; the row is used only when
          it holds; blank: always.'
        example: n == 0
      - column: template
        description: The cell's text with {statistic:format} tokens.
        example: '{mean} ({sd})'
      - column: digits
        description: 'Decimals of a token with no format, a comma between tokens;
          blank: plan_digits().'
        example: '2,3'
      - column: signif
        description: 'Significant digits (wins over digits); blank: none.'
        example: '4'
  - sheet: digits
    description: 'Table: the decimals of each statistic, written once for every analysis
      variable, and a variable''s exceptions. A template''s own format ({mean:.2f})
      or a cells row''s digits win; a table of stat_fmt (tables$value) is not rounded
      here.'
    columns:
      - column: variable
        description: 'Blank: every analysis variable (the rule); a variable: its exception.'
        example: WEIGHTBL
      - column: statistic
        description: The statistic, as the ARD names it (mean, sd, median, p ...).
        example: mean
      - column: digits
        description: 'Its decimals, a whole number (p, a percent: 1 prints 61.6).'
        example: '1'
  - sheet: layout
    description: 'Table: one row a report. Pages, groups, blank rows, stub; the prefix
      names the plan verb, the rest its argument.'
    columns:
      - column: pages_max_rows
        description: 'Rows a page (plan_paginate_rows(max_rows = )), a whole number;
          blank: as_rtftables()'' default.'
        example: '26'
      - column: pages_split
        description: 'How a page break may cut: group_safe / group_force / rows /
          ... (plan_paginate_rows(split = )); blank: as_rtftables()'' default.'
        example: group_force
      - column: pages_break_before
        description: 'Row positions to cut before, | between them, with pages_split
          = rows (plan_paginate_rows(break_before = )); blank: none.'
        example: 20 | 40
      - column: pages_min_group_rows
        description: 'Rows of a group kept together at the foot of a page, a whole
          number (plan_paginate_rows(min_group_rows = )); blank: the default.'
        example: '2'
      - column: pages_cont_label
        description: 'Appended to a group label continued on the next page (plan_paginate_rows(cont_label
          = )); quote it to keep leading spaces; blank: none.'
        example: '" (Cont.)"'
      - column: pages_page_by
        description: 'BY pages: the column(s) whose value partitions the body first,
          each value a page, the row budget then applying within one (plan_paginate_rows(page_by
          = )); | between them; print it or hide it (columns$hide); blank: none.'
        example: APERIODC
      - column: pages_heading
        description: 'With pages_page_by (one column): each BY page''s name from a
          template, as group_heading: {value} the page''s value, {n} its N as the
          ARD states it (plan_paginate_rows(heading = )); blank: the value.'
        example: 'Treatment: {value} (N={n})'
      - column: pages_heading_at
        description: 'With pages_page_by: where each BY page''s name prints, as group_heading_at
          (plan_paginate_rows(heading_at = )); blank: as the report says.'
        example: section
      - column: group_col
        description: 'With group_page = TRUE: the column whose values each start a
          page (plan_paginate_group(col = )); blank: the outermost row key.'
        example: PARAM
      - column: group_mode
        description: 'How groups print (plan_row_group(mode = )): value / indent /
          ...; blank: the default.'
        example: indent
      - column: group_collapse
        description: 'TRUE, or the columns (names or positions, | between them) whose
          repeated values print once (plan_row_group(collapse = )); blank: none.'
        example: 1 | 2
      - column: group_page
        description: 'TRUE / FALSE: one page per value of group_col (plan_paginate_group());
          blank: FALSE.'
        example: 'TRUE'
      - column: group_keep
        description: 'TRUE / FALSE: with group_page, FALSE leaves the group column
          unprinted (plan_paginate_group(keep = )); blank: TRUE.'
        example: 'FALSE'
      - column: group_heading
        description: 'With group_page = TRUE: each page''s name, the heading rtf_tables(auto_section
          = TRUE) prints, from a template: {value} the page''s value, {n} its N as
          the ARD states it (the page variable''s own tabulation, cards::ard_tabulate(adsl,
          variables = TRT01A)) (plan_paginate_group(heading = )); blank: the value.'
        example: 'Treatment: {value} (N={n})'
      - column: group_heading_at
        description: 'With group_page = TRUE: where each page''s name prints -- section
          (the section header), title (the last line of the titles) or none
          (plan_paginate_group(heading_at = )); the default of the report''s rtf_tables(auto_section
          = , auto_title = ), whose own setting wins; blank: as the report says.'
        example: section
      - column: blank_where
        description: 'Where blank rows go: a named rule such as between_groups, or
          row positions -- a blank after each, 0 before the first row, -1 after the
          last (0 | 5 | -1) (plan_blanks(where = )); blank: none.'
        example: between_groups
      - column: blank_first
        description: 'TRUE / FALSE: a blank row before the first row (plan_blanks(first
          = )); blank: the default.'
        example: 'TRUE'
      - column: blank_last
        description: 'TRUE / FALSE: a blank row after the last row (plan_blanks(last
          = )); blank: the default.'
        example: 'TRUE'
      - column: blank_counted
        description: 'TRUE / FALSE: blank rows count towards pages_max_rows (plan_blanks(counted
          = )); blank: the default.'
        example: 'TRUE'
      - column: stub_vars
        description: 'The row-key columns folded into one stub column, | between them
          (plan_stub(vars = )); blank: the row keys.'
        example: group1 | label
      - column: stub_name
        description: 'The stub column''s name (plan_stub(name = )); blank: the default.'
        example: row_label
      - column: stub_indent
        description: 'Spaces a level is indented in the stub, a whole number (plan_stub(indent
          = )); blank: the default.'
        example: '2'
      - column: stub_summary
        description: 'How a group''s summary row shows in the stub (plan_stub(group_summary
          = )); blank: the default.'
        example: header
      - column: stub_before
        description: 'TRUE / FALSE: fold the stub before cell styles and sorting see
          the rows (plan_stub(before = )); blank: FALSE.'
        example: 'TRUE'
      - column: colpages_every
        description: 'Value columns a column page, a whole number (plan_paginate_cols(every
          = )); blank: no column pages.'
        example: '4'
      - column: colpages_at
        description: The columns to cut before (names or positions), | between them
          (plan_paginate_cols(at = )).
        example: 16 | 29
      - column: colpages_cut_by
        description: 'A separator in the column names: one column page per key before
          it (plan_paginate_cols(cut_by = )).'
        example: ____
      - column: colpages_keep
        description: 'Columns printed on every column page (names or positions), |
          between them (plan_paginate_cols(keep = )); blank: the stub.'
        example: 1 | 2
      - column: colpages_fit
        description: 'TRUE / FALSE: TRUE puts every column page on page 1''s width
          scale, FALSE keeps each column''s width (plan_paginate_cols(fit = )); blank:
          TRUE.'
        example: 'FALSE'
      - column: colpages_allow_span_break
        description: 'TRUE / FALSE: FALSE never cuts inside a spanning header cell
          (plan_paginate_cols(allow_span_break = )); blank: TRUE.'
        example: 'FALSE'
      - column: colpages_order
        description: 'The order the axes nest in, outermost first: group / rows /
          cols, or across / down (plan_paginate_cols(order = )); | between them; blank:
          the default.'
        example: across
  - sheet: columns
    description: 'Table: one row a printed column, by name (the stub by stub_name,
      a value column by its keys joined with tables$sep); .values = every value column.
      Named columns win over .values.'
    columns:
      - column: column
        description: A column name, or .values.
        example: row_label
      - column: rel_width
        description: 'Relative width (a number; plan_columns(widths = )). Give one
          to every printed column (.values covers the value columns); blank: rtfreporter''s
          widths.'
        example: '5'
      - column: row_title
        description: 'TRUE / FALSE: a row-title column (plan_columns(row_title = ));
          blank: FALSE.'
        example: 'TRUE'
      - column: decimal_split
        description: 'TRUE / FALSE: align the decimal points (plan_columns(decimal
          = )); blank: FALSE.'
        example: 'TRUE'
      - column: hide
        description: 'TRUE / FALSE: used, not printed (plan_hide()); blank: FALSE.'
        example: 'TRUE'
  - sheet: style
    description: 'Table: one row a report; plan_style()''s arguments (auto_width goes
      to plan_columns()). Blank: the document''s or rtfreporter''s default.'
    columns:
      - column: border
        description: 'The table''s rules: tfl (header top and bottom, a bottom rule
