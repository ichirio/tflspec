    font_lang: {type: "vec<enum[latin|east_asian|complex], enum[ja|zh-Hans|zh-Hant|ko|ar|he|en]>", description: "The language of a font slot: {east_asian: ja}."}
    watermark: {type: "string|call<rtf_watermark>", description: "A word drawn behind every page (DRAFT), or its look too: {fn: rtf_watermark, args: {text: DRAFT, color: \"#FF0000\"}}."}
