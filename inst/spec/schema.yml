        example: Protocol XYZ-001
      - column: center
        description: The text in the centre.
        example: CONFIDENTIAL
      - column: right
        description: The text at the right.
        example: Page {PAGE} of {TOTAL_PAGES}
  - sheet: footer
    description: 'Report: the running page footer, one row a line, as header. A line
      99 on blank output_id closes every report.'
    columns:
      - column: line
        description: The line number.
        example: '99'
      - column: left
        description: The text at the left.
        example: '{PROGRAM}'
      - column: center
        description: The text in the centre.
      - column: right
        description: The text at the right.
        example: 'Generated on: {DATETIME}'
  - sheet: titles
    description: 'Report: the titles above the table, one row a line, as header.'
    columns:
      - column: line
        description: The line number.
        example: '1'
      - column: left
        description: The text at the left.
      - column: center
        description: The text in the centre.
        example: Table 14.1.1
      - column: right
        description: The text at the right.
  - sheet: footnotes
    description: 'Report: the footnotes below the table, one row a line, as header.'
    columns:
      - column: line
        description: The line number.
        example: '1'
      - column: left
        description: The text at the left.
        example: CV = Coefficient of variation
      - column: center
        description: The text in the centre.
      - column: right
        description: The text at the right.
  - sheet: tokens
    description: 'Report: tokens of your own for the header, footer, titles and footnotes,
      one row a token, written {NAME} there; a report''s row replaces the default
      of the same name, (none) takes it out.'
    columns:
      - column: name
        description: 'The token''s name: upper case, a letter then letters, digits
          or _; not one of rtfreporter''s own ({PAGE}, {PROGRAM}, {DATETIME} ...).'
        example: STUDY
      - column: value
        description: What it becomes; (none) takes a default out for this report.
        example: ABC-123
  - sheet: listings
    description: 'Listing: one row a listing (listing_spec()).'
    columns:
      - column: type
        description: 'An rtfreporter listing type (listing_spec(type = )); blank:
          multiline.'
        example: multiline
      - column: dataset
        description: The dataset listed (of the ARD spec's datasets catalog).
        example: ADAE
      - column: data
        description: 'The analysis data listed (a data_id of the report''s analysis_data),
          instead of dataset and population_id; blank: dataset and population_id say
          it.'
        example: adae_teae
      - column: population_id
        description: 'Keeps the subjects of this population; blank: every subject
          of the dataset.'
        example: SAF
      - column: where
        description: 'An R condition on its columns choosing the rows; blank: every
          row.'
        example: AESEV == "SEVERE"
      - column: sort
        description: 'The sort variables, | between them, - in front for descending;
          blank: the data''s order.'
        example: USUBJID | -ASTDY
      - column: max_rows
        description: 'Rows a page, a whole number; blank: rtfreporter''s default.'
        example: '20'
      - column: blank_row
        description: 'TRUE / FALSE: a blank row after each record (listing_spec(blank_row
          = )); blank: the type''s.'
        example: 'FALSE'
      - column: wrap
        description: 'The name of an R function that breaks a cell into lines (listing_spec(wrap
          = )); blank: the type''s own rule.'
        example: my_wrap
      - column: align
        description: 'The alignment of the columns that set none of their own (listing_spec(align
          = )): left, center or right; blank: the type''s.'
        example: left
      - column: record
        description: 'The hidden record column (listing_spec(record = )): FALSE for none, a
          name for it; blank: the standard one.'
        example: 'FALSE'
      - column: content_more
        description: 'The listing''s items the columns cannot say, as YAML (- fn:
          {args}; plan_hide, plan_paginate_group, a plan_paginate_rows with page_by
          ...): kept as they are, written back to the report''s content; blank: none.'
        example: '- plan_hide: {cols: [USUBJID]}'
  - sheet: listing_cols
    description: 'Listing: one row a printed column, in order (listing_col()).'
    columns:
      - column: vars
        description: The variables stacked in the column, | between them.
        example: USUBJID | AGE
      - column: label
        description: 'The column header; \n is a line break; blank: the variables''
          names.'
        example: Subject\nAge
      - column: width
        description: 'Characters a line before the cell wraps (listing_col(width =
          )), a whole number; blank: never wraps.'
        example: '12'
      - column: sep
        description: 'What separates the stacked variables (listing_col(sep = ));
          quote it to keep its spaces; blank: the type''s (/).'
        example: '" / "'
      - column: align
        description: 'left / center / right (listing_col(align = )); blank: the type''s
          (left).'
        example: center
      - column: collapse_repeats
        description: 'TRUE / FALSE: TRUE prints a value once until it changes; blank:
          FALSE.'
        example: 'TRUE'
      - column: more
        description: 'The column''s other listing_col() arguments the columns cannot
          say, as YAML (a map: name, rel_width, layout ...); blank: none.'
        example: '{rel_width: 2}'

# ---- figures: the functions a figure's content calls -------------------------
# A figure report's `content:` is its plots' items (R/fig_content.R): the
# function that makes a plot first, then its layers and its settings, then
# the items that arrange the plots and the image's.  `figure:` says which
# (plot | layer | ggsurvfit_layer | position | scale | helper | coord | facet |
# labs | theme | guide | element | compose | image; `position` and
# `helper` -- expansion(), sec_axis(), margin() -- are values of another
# item's argument); `rank` their order on the screen; `label` the
# function's meaning in English and Japanese; `visible` the arguments a
# card shows (the rest are the installed function's formals); `aes` a
# layer's aesthetics, `required` those it needs.  A function the catalog
# does not have (pkg::fn, or any function of a plot ggplot2 exports) is
# written and checked by its formals.  The arguments a kind's functions
# share (a layer's stat, a scale's breaks, theme()'s settings) are typed
# once, in inst/fig/gg_args.csv.

# -- the functions that make a plot (a plot's first item) --

ggplot:
  package: ggplot2
  figure: plot
  rank: 100
  stage: mapping
  label: {en: Standard plot, ja: Plot 作成}
  description: "A plot of ggplot2; its layers and settings follow."
  layers: [layer]
  visible: [data, mapping]
  args:
    data: {type: object, label: {en: Data, ja: データ}}
    mapping: {type: "map<string, column|r>", label: {en: Mapping shared by the layers, ja: レイヤー共通のマッピング}}

ggsurvfit:
  package: ggsurvfit
  figure: plot
  rank: 101
  stage: mapping
  label: {en: Kaplan-Meier curves, ja: KM 曲線}
  description: "Survival curves of a survfit2() fit (a data step of the figure)."
  layers: [ggsurvfit_layer, layer]
  visible: [x, linewidth, type]
  dots: {style: named, type: "string|number|logical|list<number|string>|call|r", description: "Passed on to the layer (colour, linewidth, alpha ...)."}
  args:
    x: {type: object, label: {en: Fit, ja: 当てはめ}}
    type: {type: "enum[survival|risk|cumhaz|cloglog]", label: {en: Scale, ja: 縦軸}}

ggcuminc:
  package: ggsurvfit
  figure: plot
  rank: 102
  stage: mapping
  label: {en: Cumulative incidence, ja: 累積発生}
  description: "Cumulative incidence curves of a tidycmprsk::cuminc() fit."
  layers: [ggsurvfit_layer, layer]
  visible: [x, outcome, linewidth]
  dots: {style: named, type: "string|number|logical|list<number|string>|call|r", description: "Passed on to the layer (colour, linewidth, alpha ...)."}
  args:
    x: {type: object, label: {en: Fit, ja: 当てはめ}}
    outcome: {type: "string|list<string>", label: {en: Outcome, ja: イベント}}

tfl_risk_panel:
  package: tflspec
  figure: plot
  rank: 103
  stage: mapping
  label: {en: Number at risk, ja: number at risk の表}
  description: "The number at risk at the x axis's breaks, from the fit, as a plot of its own under the curves (tflspec writes its code)."
  layers: []
  visible: [fit, title, size]
  args:
    fit: {type: object, label: {en: Fit, ja: 当てはめ}}
    title: {type: string, label: {en: Title, ja: 題}}
    size: {type: number, label: {en: Text size, ja: 文字の大きさ}}
    by: {type: column, label: {en: Colour variable, ja: 色の変数}}
    palette: {type: string, label: {en: Palette, ja: パレット}}
    base_size: {type: number, label: {en: Base font size, ja: 基本の文字の大きさ}}

tfl_text_column:
  package: tflspec
  figure: plot
  rank: 104
  stage: mapping
  label: {en: Text column, ja: 右のテキスト列}
  description: "Columns of text beside a plot (a forest plot's N and estimate), as a plot of its own (tflspec writes its code)."
  layers: []
  visible: [data, "y", columns, size]
  args:
    data: {type: object, label: {en: Data, ja: データ}}
    "y": {type: column, label: {en: Row position, ja: 行の位置}}
    columns: {type: string, label: {en: Columns (Heading = column | ...), ja: 列（見出し = 列 | ...）}}
    size: {type: number, label: {en: Text size, ja: 文字の大きさ}}
    base_size: {type: number, label: {en: Base font size, ja: 基本の文字の大きさ}}

tfl_n_panel:
  package: tflspec
  figure: plot
  rank: 105
  stage: mapping
  label: {en: Table of n, ja: n の表}
  description: "The n of each group at each x, as a plot of its own under the figure (tflspec writes its code)."
  layers: []
  visible: [data, x, group, label, title]
  args:
    data: {type: object, label: {en: Data, ja: データ}}
    x: {type: column, label: {en: X, ja: x}}
    group: {type: column, label: {en: Group, ja: 群}}
    label: {type: column, label: {en: The n, ja: n の列}}
    title: {type: string, label: {en: Title, ja: 題}}
    by: {type: column, label: {en: Colour variable, ja: 色の変数}}
    palette: {type: string, label: {en: Palette, ja: パレット}}
    base_size: {type: number, label: {en: Base font size, ja: 基本の文字の大きさ}}

