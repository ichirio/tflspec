          the whole table.'
        example: '12'
      - column: cont_title
        at: rtf_tables.cont_title
        description: 'With first_rows, a line under the title of each page after
          the shared one (rtf_tables(cont_title = )); blank: none.'
        example: (continued)
      - column: figure_width_in
        description: 'A figure report: the figure''s width on the page -- a number
