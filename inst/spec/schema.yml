    cell_padding_right_twips: {type: integer}
    markup: {type: logical}
    title_format: {type: string}
    footnote_format: {type: string}
    title_width: {type: "number|string"}
    footnote_width: {type: "number|string"}

rtf_document:
  package: rtfreporter
