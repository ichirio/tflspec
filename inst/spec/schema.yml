# tflspec's spec schema: the value of each argument a spec item may give.
#
# A spec's `content:` is a list of items, one a function call: the function,
# its arguments by name (tfl_item()).  An argument a function names in its
# formals is checked against them; what this file adds is the TYPE of a value,
# where the spec writes it differently from R (a YAML map for a named vector,
# rows for a data frame, `!r` for an expression or a formula), and the
# grammar of `...` for the functions whose body is `...`.  It is what
# tfl_schema() returns and tfl_schema_check() checks; the GUI's `?` and the
# AI kit's schema are read from it too.
#
# Types (a short notation):
#   string, integer, number, logical, enum[a|b]
#   column (a column name), stat (a statistic name), template (a cell
#   template, "{n} ({p:.1f%})"), r (`!r`, an R expression), formula
#   (`!r`, written as `~ <text>`), guard (`!r`, a two-sided `cond ~ "text"`),
#   call (`{fn:, args:}`), call<fn> (that
#   function's call)
#   list<T>       a YAML sequence; in R an unnamed vector (a list when T is
#                 not a scalar)
#   vec<K, V>     a YAML map of scalars; in R a named vector
#   map<K, V>     a YAML map; in R a named list
#   rows<f1, f2, ...>  a YAML sequence of maps; in R a data frame with those
#                 columns, in that order (a cell's missing field is NA)
#   T|U           either (the first that fits)
#
# `rank:` is a function's place in a table's code (the order the layers are
# written in when a report adds a function its defaults do not have).
#
# `stage:` is the part of the design a function belongs to: `mapping` (what
# goes where -- a table's roles, cells, totals, comparisons, the rows kept;
# a figure's plot and its layers), `finishing` (how it looks -- labels,
# orders, digits, the header, the stub, blank rows, pages, columns, style; a
# figure's scales, coordinates, panels, labels, theme) or `output` (a
# figure's arrangement and image).  The ranks put the mapping first: the
# order a person designs a table in, the cards' order and the code's.
#
# `tier:` (for the GUI: tflplanner's builder) is how often a table needs a
# plan function: `required` (every table: its card is there from the start),
# `usual` (most tables: offered first) or `other` (added when wanted).  It
# changes nothing in a spec or its code.
#
# `print: unnamed` writes an argument without its name in the code
# (plan_col_header()'s header, as a person writes it); its value is the
# same by position.
#
# An argument may also say its version, as a hint: `since: "rtfreporter
# 0.8.2.9047"` (the first version that has it; tfl_content_code() warns for
# an older one), and `renamed_to: <new name>` (tfl_schema_check() says the
# new name).  The last word is the installed package's formals.
#
# `dots:` says what `...` takes.  `style: named`: the item's other keys are
# its entries, by name (plan_labels: {AGE: Age}).  `style: positional`: the
# entries are the value of the one key `key:` (plan_sort: {keys: [-n]}).
# `map: true`: R code may also give the entries as one named vector
# (plan_labels(c(AGE = "Age"))), read as the same keys.

table_plan:
  package: rtfreporter
  rank: 20
  stage: mapping
  tier: required
  description: The roles -- what goes across, what goes down, which column carries the row text.
  args:
    cols: {label: "Columns", type: "list<column>", description: The key(s) that go across.}
    rows: {label: "Row layers", type: "vec<string, column>|map<string, column|guard>|list<column>", description: "The keys that go down, named as the table calls them; a constant heading as `!r '~\"Worst grade\"'`."}
    label: {label: "Row text column", type: "vec<string, column>|map<string, column|guard>|list<column>|logical", description: "The column the row text comes from; false for none."}
    stat: {label: "Statistic columns", type: "vec<string, column>", description: The columns that hold the statistic name and value.}
    show_keys: {label: "Keys shown", type: "list<column>", description: Row keys also shown as variables.}
    value: {label: "Value column", type: "column", description: "A records table: the column whose values the cells show (one row a record, the key's values across)."}

plan_sort:
  package: rtfreporter
  rank: 120
  stage: finishing
  tier: usual
  description: The row order, key by key.
  dots: {style: positional, key: keys, type: "list<string>|logical", description: "The keys to sort by, most important first; a minus for descending; false for the data's order.", example: [".overall", "-n@SOC", "SOC", ".depth", "-n", "PT"]}
  args:
    stat: {label: "Statistic counted", type: stat, description: The statistic a key sorts by.}
    keep: {label: "Print the sort columns", help: "FALSE: the columns the order is read from (the sort keys) are not printed, with no plan_hide() for them. Blank (TRUE): they are printed as they are. e.g. FALSE", type: logical}
    keys: {label: "Order"}

plan_digits:
  package: rtfreporter
  rank: 110
  stage: finishing
  tier: usual
  description: The digits of each statistic, as a house rule.
  dots: {style: named, type: "number|string|vec<stat, number|string>", description: "By variable, kind (continuous / categorical) or `default`: one number for every statistic, or one a statistic; \"3s\" for three significant digits.", example: {continuous: {mean: 1, sd: 2}, AGE: 0}}
  args:
    rounding: {label: "Rounding", type: "enum[sas|r|iec60559]", description: The tie-breaking family.}
    .rows: {label: "Decimals by row", type: "vec<string, integer|string>", description: "The digits of a statistic row (a table with stats = rows), by its label."}

plan_levels:
  package: rtfreporter
  rank: 80
  stage: finishing
  tier: usual
  description: The order (and the subset) of a variable's values.
  dots: {style: named, map: true, type: "vec<string, string>|list<string>", description: "A variable's values in their order; a map (value: text) names their text too."}
  args:
    .drop_empty: {label: "Hide empty values", type: "list<column>", description: Variables whose levels with no data are left out.}

plan_labels:
  package: rtfreporter
  rank: 90
  stage: finishing
  tier: usual
  description: The printed text of variables and values.
  dots: {style: named, map: true, type: "string|vec<string, string>", description: "A variable's label, or its values' labels."}

plan_nest:
  package: rtfreporter
  rank: 100
  stage: finishing
  tier: other
  description: Rows that belong under one level of another variable.
  dots: {style: named, type: "vec<string, string>", description: "The level of another variable a variable's rows go under: {RACE: Asian}."}
  args:
    ...: {label: "Rows under a level"}

plan_total:
  package: rtfreporter
  rank: 50
  stage: mapping
  tier: other
  description: A Total column from the ARD's overall rows.
  args:
    label: {label: "Heading", help: "The heading of the Total column. Its cells are the ARD's overall rows (the analyses run over all subjects, not split by the column key). Blank: \"Total\". e.g. \"All Subjects\"", type: string}
    position: {label: "Place", help: "Where the Total column goes among the column key's values: \"last\" or \"first\". Blank: last. e.g. \"first\"", type: "enum[last|first]"}

plan_stat_groups:
  package: rtfreporter
  rank: 40
  stage: mapping
  tier: other
  description: Columns made of groups of statistics.
  dots: {style: named, type: "list<stat>", description: "A group's name and its statistics.", example: {n: N, orr_ci: [n, estimate, conf.low, conf.high]}}
  args:
    .variables: {label: "Variables split", help: "The variables whose statistics are split into the groups. Blank: every variable. e.g. c(\"AGE\", \"BMI\")", type: "list<column>"}
    .others: {label: "Group of the other variables", help: "The group the other variables' statistics go to whole. Blank: none. e.g. \"Summary\"", type: string}
    ...: {label: "Group and its statistics"}

plan_cells:
  package: rtfreporter
  rank: 30
  stage: mapping
  tier: required
  description: How the statistics become cell text.
  dots: {style: named, type: "template|map<string, template|list<guard|template>>|call<cell_rows>|list<guard|template>", description: "By variable, context, kind (continuous / categorical), stat group or `default`: one template, one a printed row (named by its label), cell_rows() for a cell of several lines, or guards (`!r \"n == 0 ~ '0'\"`) before the template, for the kind or for one of its rows.", example: {categorical: "{n:.0f} ({p:.1f%})", continuous: {"Mean (SD)": "{mean:.1f} ({sd:.2f})"}}}
  args:
    stats: {label: "Statistics as", help: "How the statistics are laid out: \"cells\" one template a cell (n (%) in one cell), \"rows\" each statistic a row of its own. Blank: cells. e.g. \"rows\"", type: "enum[columns|rows]"}
    value: {label: "Values used", help: "Which value a template's {x} reads: the number (stat), which the template formats, or the ARD's formatted text (stat_fmt). Blank: stat. e.g. \"stat_fmt\"", type: string}
    na: {label: "Text for missing", help: "The text of a cell no template could fill (a statistic the ARD does not have). Blank: empty. e.g. \"-\"", type: string}
    notes: {label: "Notes of unused statistics", help: "FALSE: no note of the ARD's statistics that no template uses. Blank (TRUE): such statistics are listed when the table is made. e.g. FALSE", type: logical}
    default: {label: "Every cell"}
    continuous: {label: "Continuous variables"}
    categorical: {label: "Categorical variables"}

plan_filter:
  package: rtfreporter
  rank: 70
  stage: mapping
  tier: other
  description: The rows kept by a condition on the ARD's statistics.
  dots: {style: positional, key: where, type: "list<r>|r", description: "The conditions, R over a record's statistics and keys.", example: "!r p >= 0.05"}
  args:
    any: {main: true, label: "In any column", help: "TRUE: a row stays when any column's statistics meet the condition (PTs of 5% or more in any arm); FALSE: when every column's do. Blank: TRUE. e.g. FALSE", type: logical}
    parents: {main: true, label: "Parent rows", help: "\"keep\": a parent row (a SOC) stays exactly when one of its children does; \"drop\": it is judged by its own counts. Blank: keep. e.g. \"drop\"", type: "enum[keep|drop]"}
    by: {label: "Rows judged together", help: "The row key whose rows are judged together by the condition (with the keys outside it): a SOC kept or dropped as a whole. Blank: each row by itself. e.g. AEBODSYS", type: column}
    where: {label: "Condition"}

plan_compare:
  package: rtfreporter
  rank: 60
  stage: mapping
  tier: other
  description: Columns from the comparison records (tests, differences).
  dots: {style: named, type: "template|vec<string, template>|call<cell_rows>|list<guard|template>", description: "A comparison column's name and its template."}
  args:
    by: {label: "By group", help: "The column that splits the comparison records (tests, differences) into columns, one a level (each arm against placebo). Blank: one comparison a variable. e.g. \"COMPARISON\"", type: column}
    position: {label: "Place", help: "Where the comparison columns go: after the column key's values (\"last\") or before them (\"first\"). Blank: last. e.g. \"first\"", type: "enum[last|first]"}
    ...: {label: "Columns"}

plan_stub:
  package: rtfreporter
  rank: 140
  stage: finishing
  tier: usual
  args:
    vars: {label: "Variables", help: "The row keys folded into the one row label column, outermost first. Blank: worked out from the table's row layers, which is usually right. e.g. c(\"AEBODSYS\", \"AEDECOD\")", type: "list<column>"}
    name: {main: true, label: "Column name", help: "The name of the one row label column the row keys are folded into. Blank: row_label. e.g. \"stub\"", type: string}
    indent: {main: true, label: "Indent", help: "The spaces a level of the folded rows is indented by. Blank: 4. e.g. 2", type: integer}
    group_summary: {label: "Group summary rows", help: "Which rows are a group's own summary, printed on the group's heading row: \"empty\" a blank leaf, \"parent\" a leaf equal to its parent. Blank: both; \"none\" turns it off. e.g. \"empty\"", type: "enum[empty|parent]"}
    before: {main: true, label: "Before the rows", help: "TRUE: the rows are folded before the pages and groups are made, which plan_cell_style() needs to see the rows as printed; a page or group key folded away is then not found. Blank (FALSE): folded last. e.g. TRUE", type: logical}

plan_paginate_group:
  package: rtfreporter
  rank: 170
  stage: finishing
  tier: other
  args:
    col: {main: true, label: "Column", help: "The column whose value starts a new page, a page a value however long. Blank: the outermost row key. e.g. \"PARAM\"", type: column}
    keep: {main: true, label: "Keep the column", help: "FALSE: the page column is not printed (each page's name says its value). Blank (TRUE): it is printed. e.g. FALSE", type: logical}
    heading: {main: true, label: "Heading", help: "Each page's name as a template, {value} the page's value and {n} its subjects. Blank: the value. e.g. Parameter: {value}", type: string}
    heading_at: {label: "Where the heading prints", help: "Where a page's name (its heading) prints: \"section\" the section header, \"title\" under the titles, \"none\" nowhere. Blank: the report's. e.g. \"title\"", type: "enum[section|title|none]"}

plan_row_group:
  package: rtfreporter
  rank: 190
  stage: finishing
  tier: other
  args:
    mode: {main: true, label: "Group boundary", help: "How a group's first row is found: \"value\" each run of equal values, \"indent\" a row whose cell is not indented, \"filled\" a row whose cell is not empty, \"auto\". e.g. \"value\"", type: "enum[auto|indent|value|filled]"}
    collapse: {main: true, label: "A repeat printed once", help: "A repeated value printed once and then blank: TRUE in every row key, or in the columns named. e.g. TRUE", type: "list<integer>|list<column>|logical"}
    group_col: {label: "Group column", help: "The column whose runs of the same value are the groups, for a table already built (not from an ARD; an ARD table's groups are its outermost row key). e.g. \"V1\"", type: column}

plan_append:
  package: rtfreporter
  rank: 145
  stage: mapping
  tier: other
  description: Another table's rows under this one's -- its own data and items (a listing above, its summary below).
  args:
    name: {type: string, description: "The part's name; part2, part3, ... by default."}
    absent: {type: "enum[error|skip]", description: "A page group the part has no rows for: an error, or the page without the part."}
    data: {description: "Where the part's rows come from: source: ard, or source: dataset with its dataset."}
    content: {description: "The part's own table items: table_plan and the verbs that make its rows."}

plan_blanks:
  package: rtfreporter
  rank: 150
  stage: finishing
  tier: usual
  args:
    where: {main: true, label: "Where", help: "Where blank rows go: \"between_groups\" between the outermost row groups, \"between_parts\" between a table's appended parts, \"records\" after each record of a listing, \"none\" none, or as R (the rows' numbers, 0 before the first). e.g. \"between_groups\"", type: "enum[between_groups|between_parts|records|none]|list<integer>|r"}
    first: {main: true, label: "Before the first", help: "TRUE: a blank row at the top of every page. Blank: none. e.g. TRUE", type: logical}
    last: {main: true, label: "After the last", help: "TRUE: a blank row at the bottom of every page. Blank: none. e.g. TRUE", type: logical}
    counted: {label: "Count blank rows", help: "TRUE: the blank rows count toward a page's rows (plan_paginate_rows()' most rows a page), so a page never overflows. Blank: only the table's rows are counted. e.g. TRUE", type: logical}

plan_paginate_rows:
  package: rtfreporter
  rank: 160
  stage: finishing
  tier: usual
  args:
    max_rows: {main: true, label: "Most rows a page", help: "The most rows a page holds (blank rows too when they are counted: plan_blanks()). Blank: no limit. e.g. 45", type: integer}
    split: {main: true, label: "Split rule", help: "What a page break may cut: \"group_safe\" whole groups to a page (a group that does not fit starts the next), \"group_force\" every most rows a page, a group cut with a continued label, \"rows\" before the rows given in break before rows. e.g. \"group_force\"", type: "enum[none|rows|group_safe|group_force|by_value]"}
    break_before: {label: "Break before rows", help: "The row numbers a page starts at, for the split rule \"rows\". Used for breaks by hand. e.g. c(20, 40): pages 1-19, 20-39, 40-", type: "list<integer>"}
    min_group_rows: {label: "Fewest rows of a group on a page", help: "The fewest rows of a group a page may end with: a group with fewer moves whole to the next page, so its heading is not left alone at the foot. Blank: 2; 0 turns it off. e.g. 3", type: integer}
    cont_label: {label: "Continued label", help: "The text after a group's heading on the pages it continues onto. Blank: \" (Cont.)\". e.g. \" (continued)\"", type: string}
    page_by: {main: true, label: "Page by", help: "The columns whose value starts a new page first, each page named after it; the most rows a page applies within each. e.g. \"PARAM\"", type: "list<column>"}
    heading: {label: "Heading", help: "With page by one column: each page's name as a template, {value} the page's value and {n} its subjects. e.g. Treatment: {value} (N={n})", type: string}
    heading_at: {label: "Where the heading prints", help: "Where a page's name (its heading) prints: \"section\" the section header, \"title\" under the titles, \"none\" nowhere. Blank: the report's. e.g. \"title\"", type: "enum[section|title|none]"}

plan_paginate_cols:
  package: rtfreporter
  rank: 180
  stage: finishing
  tier: other
  args:
    at: {main: true, label: "Break before columns", help: "The columns a new column page starts before. One of these, cut by or columns a page is given. e.g. \"Drug Y\"", type: "list<integer>|list<column>"}
    cut_by: {main: true, label: "Cut by", help: "The column blocks as a list, or a separator in the columns' names (a block a key value). e.g. \"____\"", type: string}
    every: {main: true, label: "Columns a page", help: "A new column page every this many columns (the columns on every page not counted). e.g. 3", type: integer}
    keep: {main: true, label: "Columns on every page", help: "The columns every column page repeats. Blank: the row heading columns. e.g. \"row_label\"", type: "list<integer>|list<column>"}
    fit: {main: true, label: "Fit to the page", help: "TRUE: every page's columns on page 1's scale, filling the width; FALSE: each column keeps its width. e.g. FALSE", type: logical}
    allow_span_break: {main: true, label: "A spanning header may break", help: "FALSE: a page is not cut inside a spanning header's cell. Blank: TRUE. e.g. FALSE", type: logical}
    order: {main: true, label: "Order of the pages", help: "The order the pages come out in: \"across\" a row's column pages one after another, \"down\" all the rows' pages of a block first. Blank: across. e.g. \"down\"", type: "enum[across|down]|list<enum[group|rows|cols]>"}
    col_header: {label: "Header of the column pages", help: "What each column page's header becomes, as R. Used when the pages need a header other than the table's own. Blank: the table's header, cut with its columns."}

plan_style:
  package: rtfreporter
  rank: 220
  stage: finishing
  tier: usual
  args:
    table_width_pct: {label: "Table width (%)", help: "The table's width as a percent (0-100) of the page's writable width. e.g. 80", type: number}
    table_width_pct_of_writable: {label: "Table width (% of the writable width)", help: "The table's width as a fraction (0-1) of the page's writable width (as table_width_pct, by 0-1). e.g. 0.8", type: number}
    table_width_twips: {label: "Table width (twips)", help: "The table's width in twips (1/1440 inch); it wins over the widths in percent. Blank: the page's writable width. e.g. 12960", type: integer}
    row_height_twips: {label: "Row height (twips)", help: "The height of the body's rows in twips (1/1440 inch). Blank: from the font size. e.g. 240", type: integer}
    border_header: {label: "Header borders", help: "The rules of the column header's rows, one kind of row's (with border_spanning ... border_last_row: a style of one's own in place of Borders). e.g. \"bottom\"", type: "call<rtf_border>"}
    border_spanning: {label: "Spanning header borders", help: "The rules under a spanning header's cells (the header over several columns). e.g. \"bottom\"", type: "call<rtf_border>"}
    border_body: {label: "Body borders", help: "The rules of the body's rows. Blank: none between them. e.g. \"none\"", type: "call<rtf_border>"}
    border_first_row: {label: "First row's border", help: "The rule over the table's first row (the top of the table). e.g. \"top\"", type: "call<rtf_border>"}
    border_last_row: {label: "Last row's border", help: "The rule under the table's last row (the foot of the table). e.g. \"bottom\"", type: "call<rtf_border>"}
    align_count_pct: {main: true, label: "Align n (%)", type: "logical", help: "TRUE: the n and the (%) of a count cell line up from row to row. e.g. TRUE"}
    border: {main: true, label: "Borders", type: "string", help: "The table's borders: \"tfl\" (rules over and under the header and under the last row) or \"none\"; another style as R (rtf_border()). Blank: tfl. e.g. \"none\""}
    font_size_half_points: {main: true, label: "Font size (half points)", type: "integer", help: "The table's font size in half points (18 = 9 pt). Blank: the document's. e.g. 16"}
    font: {label: "Font", help: "The table's font. Blank: the document's font. e.g. \"Arial\"", type: "string|vec<string, string>"}
    row_height_exact: {label: "Exact row height", help: "TRUE: the rows' height is exact (a longer text is cut); FALSE: it is the least height (a row grows). e.g. TRUE", type: "logical"}
    header_row_height_twips: {label: "Header row height (twips)", help: "The height of the column header's rows in twips. Blank: as the body's. e.g. 300", type: "integer"}
    blank_row_height_twips: {label: "Blank row height (twips)", help: "The height of the blank rows in twips: lower ones make a table shorter. Blank: as the body's. e.g. 120", type: "integer"}
    cell_padding_left_twips: {label: "Cell padding, left (twips)", help: "The space between a cell's left border and its text, in twips. Blank: 0. e.g. 60", type: "integer"}
    cell_padding_right_twips: {label: "Cell padding, right (twips)", help: "The space between a cell's text and its right border, in twips. Blank: 0. e.g. 60", type: "integer"}
    cell_valign: {label: "Vertical alignment", help: "Where a cell's text sits from top to bottom: \"bottom\", \"top\" or \"center\". Blank: bottom. e.g. \"top\"", type: "enum[bottom|top|center]"}
    table_align: {label: "Table alignment", help: "Where the table sits on the page: \"left\", \"center\" or \"right\". Blank: left. e.g. \"center\"", type: "enum[left|center|right]"}
    markup: {label: "Markup in the text", help: "The marks in the cells' text turned into print: \"script\" ^{...} superscript and _{...} subscript, \"relational\" >= and <= as signs, \"all\", \"none\". Blank: the document's (script). e.g. \"all\"", type: "enum[script|relational|all|none]|list<enum[script|relational]>"}
    blank_row_normalize: {label: "Blank rows as one", help: "How blank rows are tidied: \"detect\" an empty row printed as one blank row, \"collapse\" several in a row made one. Blank: both. e.g. \"detect\"", type: "enum[detect|collapse|none]|list<enum[detect|collapse]>"}
    header_align: {label: "Header alignment", help: "The column header's alignment: \"left\", \"center\" or \"right\". Blank: center. e.g. \"left\"", type: "enum[left|center|right]"}
    header_bold: {label: "Header bold", help: "TRUE: the whole column header in bold. e.g. TRUE", type: "logical"}
    header_italic: {label: "Header italic", help: "TRUE: the whole column header in italics. e.g. TRUE", type: "logical"}
    align: {label: "Alignment", help: "The body's alignment: \"left\", \"center\" or \"right\" (one column's: Cell styles). e.g. \"center\"", type: "enum[left|center|right]"}
    bold: {label: "Bold", help: "TRUE: the whole body in bold (some cells only: Cell styles). e.g. TRUE", type: "logical"}
    italic: {label: "Italic", help: "TRUE: the whole body in italics (some cells only: Cell styles). e.g. TRUE", type: "logical"}
    underline: {label: "Underline", help: "TRUE: the whole body underlined (some cells only: Cell styles). e.g. TRUE", type: "logical"}

plan_cell_style:
  package: rtfreporter
  rank: 230
  stage: finishing
  tier: other
  args:
    cols: {main: true, label: "Columns styled", help: "The columns styled, by name (.values every value column). Blank: every column. e.g. .values", type: "list<column>"}
    header: {main: true, label: "The column header", help: "TRUE: the column header is styled (not the body). e.g. TRUE", type: logical}
    where: {main: true, label: "Rows styled", type: formula, description: "The rows it applies to, R over the table's columns: `!r \"p > 0.5\"`."}
    indent_twips: {label: "Indent (twips)", help: "The left indent of the chosen cells' text in twips (not the header's). e.g. 240", type: integer}
    border: {label: "Borders", help: "The chosen cells' borders, as R (rtf_border()). e.g. rtf_border(bottom = \"single\")", type: "call<rtf_border>"}
    bold: {main: true, label: "Bold", type: "enum[TRUE|FALSE]|logical", help: "TRUE: the chosen cells in bold; FALSE: not. Blank: as they are. e.g. TRUE"}
    italic: {main: true, label: "Italic", type: "enum[TRUE|FALSE]|logical", help: "TRUE: the chosen cells in italics; FALSE: not. Blank: as they are. e.g. TRUE"}
    align: {main: true, label: "Alignment", type: "enum[left|center|right]", help: "The chosen cells' alignment: \"left\", \"center\" or \"right\". e.g. \"left\""}
    color: {main: true, label: "Text colour", type: "colour|r|map<column, r>", help: "The chosen cells' text colour. e.g. \"#CC0000\""}
    background: {main: true, label: "Background colour", type: "colour|r|map<column, r>", help: "The chosen cells' background colour. e.g. \"#F2F2F2\""}
    underline: {label: "Underline", type: "enum[TRUE|FALSE]|logical", help: "The chosen cells underlined: TRUE / FALSE, or a condition as R. e.g. TRUE"}

plan_hide:
  package: rtfreporter
  rank: 200
  stage: finishing
  tier: other
  description: Columns kept in the data but not printed.
  dots: {style: positional, key: cols, type: "list<column>"}
  args:
    cols: {main: true, label: "Hidden columns", type: "list<column>", help: "The columns not printed, by name: a key a page break or an order reads stays in the data. e.g. TRT01AN"}

plan_empty:
  package: rtfreporter
  rank: 75
  stage: mapping
  tier: other
  description: A table of no events -- one row saying so, and a footnote, only when the table has no row or its overall row is 0.
  args:
    text: {type: string, description: "The row's text; blank: \"No subjects met the criteria.\"."}
    when: {type: "enum[auto|no_rows|overall_zero]", description: "When the table counts as empty: no row (no_rows), its overall row 0 (overall_zero), or either (auto, the default)."}
    position: {type: "enum[last|first|replace]", description: "Where the row goes: after the rows (last: the overall row's 0 stays), first, or alone (replace)."}
    footnote: {type: string, description: "A footnote added only when the table is empty."}

plan_col_header:
  package: rtfreporter
  rank: 130
  stage: finishing
  tier: usual
  args:
    header: {label: "Header lines", type: "rows<line, cols, span, text, align, bold, italic, border_top, border_bottom>|call<rtf_col_header>", print: unnamed, description: "The header: its cells, one a row (`line`, `cols`, `span`, `text`), or an rtf_col_header() call."}
    lines: {label: "Header lines, a row at a time", type: "list<vec<string, string>>", description: "The header a row at a time: each row a map, a cell's name the columns it sits on."}
    values: {label: "Values of the tokens", help: "What the header's tokens take: TRUE (list(n = TRUE)) reads each column's N from the ARD; numbers named by column give them by hand. e.g. list(n = TRUE)", type: "map<string, logical|vec<string, number>>"}
    col_header_align: {label: "Alignment", help: "The column header's alignment: \"left\", \"center\" or \"right\". Blank: center. e.g. \"left\"", type: string}
    header_sep: {label: "Header separator", help: "The text a plain table's column names are cut at into spanning header rows. e.g. \"____\"", type: "string"}
    span: {label: "Cells over columns", help: "How a cell of the header lines over several columns is made: \"each\" a cell a column, \"one\" one cell over them all, or a key's name (a cell a value of that key: a spanner). Blank: each. e.g. \"one\"", type: "string|r"}

plan_columns:
  package: rtfreporter
  rank: 210
  stage: finishing
  tier: usual
  args:
    widths: {main: true, label: "Widths", help: "The columns' relative widths, by column (.values every value column). e.g. row_label 5, .values 2", type: "vec<column, number>|list<number>"}
    decimal: {main: true, label: "Decimal alignment", help: "The columns whose numbers line up at the decimal point (.values every value column). e.g. .values", type: "list<column>"}
    row_title: {main: true, label: "Row title", help: "The row heading columns: left aligned (the others centred) and repeated on every column page. Blank: the first column. e.g. row_label", type: "list<column>|list<integer>"}
    auto_width: {main: true, label: "Automatic width", help: "TRUE: each column sized to its content. e.g. TRUE", type: logical}
    sep: {label: "Separator", help: "The text that joins several column keys in the value columns' names; the spanning header is cut at it. Blank: \"____\" (Placebo____F). Changed only when a value has \"____\" in it. e.g. \"__\"", type: string}
    cell_format: {label: "Cell formats", help: "A function that formats the cells' text, or a list of them one a column, as R. e.g. function(x) toupper(x)"}
    column_widths_twips: {label: "Column widths (twips)", help: "Each column's width in twips (1/1440 inch), as R; it replaces the widths above. e.g. c(3000, 1500, 1500)", type: "list<integer>"}

plan_listing:
  package: rtfreporter
