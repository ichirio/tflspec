# tflspec_v1/templates/lab_tox_shift.yml
template: lab_tox_shift
label: Shift in toxicity grade, baseline to worst, in each direction
params:
  by:
    type: list<column>
    input: pick
    choices: vars(adsl_sub)
    required: true
    step: analysis
    tier: required
    description: The column variable(s); the groups across.
  conditions:
    type: rows<tox_dir,param>
    input: table
    columns: params
    required: true
    step: analysis
    tier: required
    description: One row a lab test and direction, each its own analysis, its id <PARAMCD>_<direction> such as ALT_HIGH (an optional analysis_id column overrides it); tox_dir Low or High, param a level of PARAM. The worst and base grade columns come from the direction in the item (ATOXGRL and BTOXGRL for Low, ATOXGRH and BTOXGRH for High); there is no per-row grade-not-NA condition. Each analysis's N can differ from the output's N.
  denominator:
    type: string
    input: pick
    choices: report_data
    default: adsl_sub
    step: analysis
    tier: usual
    description: The data row whose subjects are the group Ns (BIGN) and the
      percentages' denominator; both come from the one BIGN item.
  record_where:
    type: r
    input: condition
    choices: vars(ADLB)
    default: !r AVISIT == "WORST POST-BASELINE"
    step: data
    tier: usual
    description: The records that are each subject's worst, one a subject, test
      and direction (the ADaM's own worst record); the template does not compute
      it. Written in the adlb_sub data row's where. For an ADaM with no worst
      record, set this to TRUE and give the report's adlb_sub row a then (R that picks
      the record, such as dplyr::slice_max()), or replace the row's where / then
      in the report.
  formats:
    type: map<string,number|string>
    input: table
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: usual
    description: The decimals (or the format) of each statistic.
extends: !series extends
style: !series style
data:
  - id: adsl_sub
    from: ADSL
    population: !series population_safety
  - id: adlb_sub
    from: ADLB
    subjects_in: adsl_sub
    add: ["{by}"]
    where: !r "{record_where}"
analysis:
  - id: BIGN
    label: Subjects per group
    method: categorical
    data: "{denominator}"
    variables: ["{by}"]
    formats: "{formats}"
  - id: SHIFT
    analyses: {per: [PARAMCD, tox_dir]}   # ALT_HIGH, ...
    label: Shift in toxicity grade, baseline to worst, in each direction
    data: adlb_sub
    params: [tox_dir, param]
    conditions: "{conditions}"
    where: !r PARAM == "{param}"
    derive: !r worst = if ("{tox_dir}" == "Low") ATOXGRL else ATOXGRH | base = if ("{tox_dir}" == "Low") BTOXGRL else BTOXGRH | tox_dir = "{tox_dir}"
    levels: {PARAM: "{param}", tox_dir: "{tox_dir}"}
    method: categorical
    statistics: [n, p]
    denominator: BIGN
    formats: "{formats}"
    ards:
      - {by: ["{by}", PARAM, tox_dir, base], variables: [worst]}   # cells
      - {by: ["{by}", PARAM, tox_dir], variables: [worst]}            # Total column
      - {by: ["{by}", PARAM, tox_dir], variables: [base]}             # Total row
      - {by: ["{by}", PARAM], variables: [tox_dir]}                       # corner
page:
  titles: ~
  footnotes: ~
