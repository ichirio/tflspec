# tflspec_v1/templates/listing.yml
template: listing
label: Listing of records
params:
  from:
    type: string
    input: pick
    choices: study_data
    required: true
    step: data
    tier: required
    description: The dataset of the records.
  columns:
    type: list<column>
    input: pick
    choices: vars(lst_sub)
    ordered: true
    required: true
    step: content
    tier: required
    description: The columns of the listing, in order.
  by:
    type: column
    input: pick
    choices: vars(adsl_sub)
    default: ~
    step: analysis
    tier: usual
    description: The group variable of the header N; empty for one total.
  formats:
    type: map<string,number|string>
    input: table
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: other
    description: The decimals (or the format) of the header N statistics.
extends: !series extends
style: !series style_listing
data:
  - id: adsl_sub
    from: ADSL
    population: !series population_safety
  - id: lst_sub
    from: "{from}"
    subjects_in: adsl_sub
    add: ~
    where: ~
    arrange: ~
analysis:
  - id: BIGN
    label: Subjects, total
    method: cards::ard_total_n
    data: adsl_sub
page:
  titles: ~
  footnotes: ~
