# tflspec_v1/templates/km_simple.yml
template: km_simple
label: KM curves
figure: km_curves
params:
  by:
    type: column
    input: pick
    choices: vars(adsl_sub)
    required: true
    step: analysis
    tier: required
    description: The group variable; one curve a group.
  time_unit:
    type: enum[days|months]
    input: pick
    choices: fixed
    default: !series time_unit
    step: data
    tier: usual
    description: The unit the analysis and the axis use; AVAL is converted from its unit, AVALU, to it (tte_time()).
  time:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series time
    unset: stop
    step: analysis
    tier: other
    description: The column of the time to event.
  censor:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series censor
    unset: stop
    step: analysis
    tier: other
    description: The censoring column (0 is the event, any other value a censoring).
  formats:
    type: map<string,number|string>
    input: table
    columns: {key: {label: {en: "Statistic", ja: "統計量"}}, value: {label: {en: "Format", ja: "書式"}}}
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: other
    description: The decimals (or the format) of the legend N.
      A report's names go over the series' formats; `!unset` removes one.
  x_label:
    type: string
    input: text
    default: "Time ({time_unit})"
    step: content
    tier: usual
    description: The label of the x axis.
  y_label:
    type: string
    input: text
    default: Survival Probability
    step: content
    tier: usual
    description: The label of the y axis.
  legend:
    type: enum[inside|bottom|none]
    input: pick
    choices: fixed
    default: bottom
    step: content
    tier: other
    description: Where the legend goes (inside at the top right, bottom); none for no legend.
extends: !series extends
style: !series style
data:
  - id: adsl_sub
    from: ADSL
    population: !series population_efficacy
  - id: adtte_sub
    from: ADTTE
    subjects_in: adsl_sub
    add: ["{by}"]
    where: !r PARAMCD == "OS"
    then: !r 'tte_time("{time_unit}")'
analysis:
  - id: BIGN
    label: Subjects per group
    method: categorical
    data: adsl_sub
    variables: ["{by}"]
    formats: "{formats}"
page:
  titles: ~
  footnotes: ~
