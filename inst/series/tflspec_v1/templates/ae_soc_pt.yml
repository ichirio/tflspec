# tflspec_v1/templates/ae_soc_pt.yml
template: ae_soc_pt
label: Adverse events by SOC and PT
params:
  by:
    type: list<column>
    input: pick
    choices: vars(adsl_sub)
    required: true
    step: analysis
    tier: required
    description: The column variable(s); the groups across.
  hierarchy:
    type: list<column>
    input: pick
    choices: vars(adae_sub)
    ordered: true
    default: [AEBODSYS, AEDECOD]
    step: analysis
    tier: usual
    description: The levels of the rows, outer first.
  any_row:
    type: logical
    input: pick
    choices: fixed
    default: true
    step: analysis
    tier: usual
    description: A first row of the subjects with any event.
  denominator:
    type: string
    input: pick
    choices: report_data
    default: adsl_sub
    step: analysis
    tier: usual
    description: The data row whose subjects are the group Ns (BIGN) and the
      percentages' denominator; both come from the one BIGN item.
  total:
    type: logical
    input: pick
    choices: fixed
    default: !series total
    step: analysis
    tier: usual
    description: A Total column from the overall rows.
  min_pct:
    type: number
    input: text
    default: ~
    step: analysis
    tier: other
    description: Keep only the rows with at least this percentage; empty keeps all.
  min_pct_in:
    type: enum[any|all|overall]
    input: pick
    choices: fixed
    default: any
    step: analysis
    tier: other
    description: Where min_pct must be reached; any group, all groups or the overall column.
  formats:
    type: map<string,number|string>
    input: table
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: usual
    description: The decimals (or the format) of each statistic.
extends: !series extends
style: !series style
data:
  - id: adsl_sub
    from: ADSL
    population: !series population_safety
  - id: adae_sub
    from: ADAE
    subjects_in: adsl_sub
    add: ["{by}"]
    where: !r TRTEMFL == "Y"
analysis:
  - id: BIGN
    label: Subjects per group
    method: categorical
    data: "{denominator}"
    variables: ["{by}"]
    formats: "{formats}"
  - id: AE
    analyses: {per: level}      # AE_ANY, AE_L1, AE_L2
    label: Adverse events by SOC and PT
    method: hierarchical
    data: adae_sub
    by: ["{by}"]
    overall: "{total}"
    variables: "{hierarchy}"
    denominator: BIGN
    args: !r over_variables = {any_row}
    post: !r keep_min_pct({min_pct}, "{min_pct_in}")
    formats: "{formats}"
page:
  titles: ~
  footnotes: ~
