# tflspec_v1/templates/forest_hr.yml
template: forest_hr
label: Forest plot, hazard ratio by subgroup
figure: forest_hr
params:
  population:
    type: string
    input: pick
    choices: populations
    default: !series population_efficacy
    step: data
    tier: usual
    description: The analysis set adsl_sub keeps (data.yml's populations).
  by:
    type: column
    input: pick
    choices: vars(adsl_sub)
    required: true
    step: analysis
    tier: required
    description: The treatment variable compared.
  ref:
    type: level
    input: pick
    choices: levels(from_args(by))
    default: ~
    step: data
    tier: usual
    description: The reference arm; empty for the first in the code list.
  comparison:
    type: string
    input: pick
    choices: levels(from_args(by))
    default: ~
    step: analysis
    tier: usual
    description: The arm compared against the reference
  conditions:
    type: rows<subgroup,subgroup_lvl,where>
    input: table
    columns: params
    default: []
    step: analysis
    tier: usual
    description: The subgroup rows, one a subgroup level, after the ALL row.
  subgroup_vars:
    type: list<column>
    input: pick
    choices: vars(adsl_sub)
    ordered: true
    default: []
    step: data
    tier: usual
    description: The subject-level variables the subgroup conditions read, joined from adsl_sub.
  time:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series time
    step: analysis
    tier: other
    description: The column of the time to event.
  censor:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series censor
    step: analysis
    tier: other
    description: The censoring column (0 is the event, any other value a censoring).
  formats:
    type: map<string,number|string>
    input: table
    columns: {key: {label: {en: "Statistic", ja: "統計量"}}, value: {label: {en: "Format", ja: "書式"}}}
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: other
    description: The decimals (or the format) of each statistic.
      A report's names go over the series' formats; `!unset` removes one.
  # (the look: forest_hr()'s params with its defaults; the call writes each
  # one the report or the default gives, .fig_content_table())
  subgroup_labels:
    type: map<column,string>
    input: table
    columns: {key: {label: {en: "Variable", ja: "変数"}}, value: {label: {en: "Heading", ja: "見出し"}}}
    choices: from_args(subgroup_vars)
    default: ~
    step: content
    tier: other
    description: The heading of each subgroup, by its variable (one of subgroup_vars);
      empty for the common ADaM variables' labels (SEX, AGEGR1, RACE ...), else the variable's name.
  favours:
    type: list<string>
    input: text
    ordered: true
    default: ~
    step: content
    tier: other
    description: Two labels under the axis, left and right of 1 (exactly two); empty for none.
  x_breaks:
    type: list<number>
    input: text
    default: ~
    step: content
    tier: other
    description: The ticks of the hazard ratio axis; empty for ggplot2's.
  size_by_n:
    type: logical
    input: pick
    choices: fixed
    default: false
    step: content
    tier: other
    description: A point's size by its subjects (N).
  bold_headings:
    type: logical
    input: pick
    choices: fixed
    default: false
    step: content
    tier: other
    description: The subgroups' headings in bold.
  n_by_arm:
    type: list<level>
    input: pick
    choices: levels(from_args(by))
    ordered: true
    default: ~
    step: content
    tier: other
    description: The arms whose events / subjects are shown, a column each after N; empty for none.
extends: !series extends
style: !series style
data:
  - id: adsl_sub
    from: ADSL
    population: "{population}"
  - id: adtte_sub
    from: ADTTE
    subjects_in: adsl_sub
    add: ["{by}", "{subgroup_vars}"]
    # (the parameter: this row's default; a report's row of this id gives
    # its own, data: [{id: adtte_sub, where: !r PARAMCD == "PFS"}])
    where: !r PARAMCD == "OS"
    derive: !r '{by} = stats::relevel(factor({by}), ref = c(intersect("{ref}", {by}), levels(factor({by})))[1])'
analysis:
  - id: BIGN
    label: Subjects per group
    method: categorical
    data: adsl_sub
    variables: ["{by}"]
    formats: "{formats}"
  - id: HR
    label: Hazard ratio, overall and in each subgroup level
    method: regression
    data: adtte_sub
    params: [subgroup, subgroup_lvl, where]
    conditions:
      - {subgroup: ALL, subgroup_lvl: ALL, where: !r TRUE}
      - "{conditions}"
    where: !r "{where}"
    args: !r formula = survival::Surv({time}, {censor} == 0) ~ {by}, method = "coxph", package = "survival", exponentiate = TRUE
    post: !r dplyr::mutate(group1 = "subgroup", group1_level = list("{subgroup}"), group2 = "subgroup_lvl", group2_level = list("{subgroup_lvl}"))
    formats: "{formats}"
page:
  titles: ~
  footnotes: ~
