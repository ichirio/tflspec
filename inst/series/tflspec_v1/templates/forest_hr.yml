# tflspec_v1/templates/forest_hr.yml
template: forest_hr
label: Forest plot, hazard ratio by subgroup
figure: forest_hr
params:
  by:
    type: column
    input: pick
    choices: vars(adsl_sub)
    required: true
    step: analysis
    tier: required
    description: The treatment variable compared.
  ref:
    type: level
    input: pick
    choices: levels(by)
    default: ~
    step: data
    tier: usual
    description: The reference arm; empty for the first in the code list.
  comparison:
    type: level
    input: pick
    choices: levels(by)
    default: ~
    step: content
    tier: usual
    description: The arm shown against the reference; empty for the first arm with an interval.
  conditions:
    type: rows<subgroup,subgroup_lvl,where>
    input: table
    columns: params
    default: []
    step: analysis
    tier: usual
    description: The subgroup rows, one a subgroup level, after the ALL row.
  overall_row:
    type: logical
    input: pick
    choices: fixed
    default: !series overall_row
    step: analysis
    tier: other
    description: The ALL row, overall, before the subgroup rows.
  time:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series time
    step: analysis
    tier: other
    description: The column of the time to event.
  censor:
    type: column
    input: pick
    choices: vars(adtte_sub)
    default: !series censor
    step: analysis
    tier: other
    description: The censoring column (1 censored, 0 event).
  formats:
    type: map<string,number|string>
    input: table
    choices: stats
    free: true
    default: !series formats
    step: analysis
    tier: other
    description: The decimals (or the format) of each statistic.
extends: !series extends
style: !series style
data:
  - id: adsl_sub
    from: ADSL
    population: !series population_efficacy
  - id: adtte_sub
    from: ADTTE
    subjects_in: adsl_sub
    add: ["{by}"]
    where: !r PARAMCD == "OS"
    derive: !r '{by} = stats::relevel(factor({by}), ref = "{ref}")'
analysis:
  - id: BIGN
    label: Subjects per group
    method: categorical
    data: adsl_sub
    variables: ["{by}"]
    formats: "{formats}"
  - id: HR
    label: Hazard ratio, overall and in each subgroup level
    method: regression
    data: adtte_sub
    params: [subgroup, subgroup_lvl, where]
    conditions:
      - {subgroup: ALL, subgroup_lvl: ALL, where: !r TRUE}
      - "{conditions}"
    where: !r "{where}"
    args: !r survival::coxph(ggsurvfit::Surv_CNSR({time}, {censor}) ~ {by}, data = data), exponentiate = TRUE
    post: !r dplyr::mutate(group1 = "subgroup", group1_level = list("{subgroup}"), group2 = "subgroup_lvl", group2_level = list("{subgroup_lvl}"))
    formats: "{formats}"
page:
  titles: ~
  footnotes: ~
