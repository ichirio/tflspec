id: T-14-3-5
kind: table
label: Shift from Baseline in Laboratory Normal Range Indicator at Cycle 2 Day 1
population: SAF
extends:
  - defaults
ard:
  analysis_data:
    - id: adlb_c2
      from: ADLB
      population: SAF
      where: !r AVISIT == "CYCLE 2 DAY 1" & PARAMCD %in% c("ALT", "AST")
  analyses:
    - id: SHIFT
      method: categorical
      data: adlb_c2
      by:
        - TRT01A
        - PARAMCD
        - BNRIND
      variables:
        - ANRIND
data:
  source: ard
content:
  - table_plan:
      cols:
        - TRT01A
        - .label
      rows:
        group: PARAMCD
      label: BNRIND
  - plan_cells:
      categorical: '{n}'
  - plan_levels:
      TRT01A:
        - Drug X
        - Control
      BNRIND:
        - LOW
        - NORMAL
        - HIGH
      .label:
        - LOW
        - NORMAL
        - HIGH
  - plan_labels:
      PARAMCD:
        ALT: Alanine Aminotransferase (U/L)
        AST: Aspartate Aminotransferase (U/L)
  - plan_stub:
      vars:
        - group
        - BNRIND
      name: row_label
      before: true
  - plan_col_header:
      header:
        - line: '1'
          cols: .values
          span: TRT01A
          text: '{col1}'
        - line: '2'
          cols: row_label
          text: Parameter / Baseline
        - line: '2'
          cols: .values
          span: each
          text: '{col}'
page:
  titles:
    '1':
      center: Table 14.3.5
    '2':
      center: Shift from Baseline in Laboratory Normal Range Indicator at Cycle 2
        Day 1
    '3':
      center: Safety Population
ai:
  assumptions:
    - where: ard.analysis_data
      item: visit
      assumption: the shell's on-treatment visit is CYCLE 2 DAY 1; ALT and AST only
      question: Which visit, or the worst post-baseline value?

