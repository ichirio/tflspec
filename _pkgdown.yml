url: https://ichirio.github.io/tflspec/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#1d5e47"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

# As rtfreporter and tflplanner: published at the root.
development:
  mode: unreleased
  version_label: warning

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  # The Articles menu written out, as rtfreporter's: the English articles
  # only; a Japanese one is reached from the toggle at the top of its
  # English page.
  components:
    articles:
      text: Articles
      menu:
        - text: "The workflow"
        - text: "The ARD spec"
          href: articles/ard-spec.html
        - text: "The table spec"
          href: articles/table-spec.html
        - text: "Reports: headers, footers, titles, footnotes and tokens"
          href: articles/reports.html
        - text: -------
        - text: "Listings, figures and ARS"
        - text: "Listings"
          href: articles/listings.html
        - text: "Figures"
          href: articles/figures.html
        - text: "CDISC ARS export and import"
          href: articles/ars.html
        - text: -------
        - text: "Drafting with an AI chat"
        - text: "Drafting tables' code spec with an AI chat"
          href: articles/ai-table-drafting.html

# The articles follow the one workflow: the ARD spec, the table spec, the
# report around it; then listings, figures and ARS.  "Get started" is
# vignettes/articles/tflspec.Rmd (pkgdown's intro).  They are articles, not
# vignettes: built by pkgdown only, never by R CMD check.
articles:
  - title: The workflow
    navbar: The workflow
    contents:
      - articles/ard-spec
      - articles/table-spec
      - articles/reports
  - title: Listings, figures and ARS
    navbar: Listings, figures and ARS
    contents:
      - articles/listings
      - articles/figures
      - articles/ars
  - title: Drafting with an AI chat
    navbar: Drafting with an AI chat
    desc: >
      The article opens in English with an "In Japanese" toggle at the top.
    contents:
      - articles/ai-table-drafting

  # As rtfreporter: a Japanese article is reached from the toggle at the
  # top of its English page, not from the navbar menu.
  - title: 日本語の記事 / Japanese
    desc: >
      Japanese versions, reachable from the "In Japanese" toggle at the top
      of each English page.  英語の記事の頭の切り替えから開く日本語版です。
    navbar: ~
    contents:
      - articles/ai-table-drafting-ja

# Grouped by the workflow: ARD spec -> ARD code, the data, table spec ->
# table plan, report spec, listings, figures, ARS; then the workbooks, the
# checks, the review, the AI manual and helpers.  Each help page is listed once.
reference:
  - title: ARD spec and ARD code
    desc: >
      The analyses of a study as a workbook -- its datasets, analysis sets,
      analysis data and one cards / cardx call per `analyses` row -- and
      the short R program it stands for (`tfl_ard_code()`), or that program
      run (`tfl_build_ard()`): one study ARD.
    contents:
      - tfl_read_ard_spec
      - tfl_ard_spec_template
      - tfl_ard_code
      - tfl_build_ard
      - tfl_ard_for
      - tfl_ard_spec_hash
  - subtitle: Methods, statistics and functions of one's own
    desc: >
      What a `method` may name: the keywords, any cards / cardx function
      and its arguments, an analysis written as R (`custom`), a function
      of the study's own.
    contents:
      - tfl_ard_methods
      - tfl_ard_statistics
      - tfl_ard_functions
      - tfl_ard_args
      - tfl_ard_as_custom
      - tfl_ard_function_template
      - tfl_ard_function_info
  - title: The functions the programs call
    desc: >
      The code of the functions the generated programs call as they run (the
      code lists on a data, the ids in front, the formats, the study ARD),
      which a study keeps in a file of its own: its programs run without
      tflspec.
    contents:
      - tfl_helpers_code
  - title: Data, analysis data and populations
    desc: >
      The `datasets`, `populations` and `analysis_data` sheets of the ARD
      spec say what is read and how the analysis data are made (see
      `tfl_read_ard_spec()`); these write the line that reads a dataset
      and give data to try things on.
    contents:
      - tfl_read_data_code
      - tfl_read_adam
      - tfl_example_adam
  - subtitle: An oncology sample study
    desc: >
      Simulated ADaM datasets of one oncology study, XYZ-ONC-01 (Drug X vs
      Control), that agree with one another; its SAP and CRF outline are in
      `system.file("sample", "onco", package = "tflspec")`.
    contents:
      - adsl
      - adex
      - adae
      - adlb
      - advs
      - adrs
      - adtr
      - adtte
  - title: Document import
    desc: >
      A study's define (Define-XML 2.0 / 2.1, or the workbook it is made
      from) read by rule: its datasets, variables and code lists, and a
      report's code lists and labels as `codelists` rows.
    contents:
      - tfl_read_define
      - tfl_read_define_spec
      - tfl_define_profile
      - tfl_define_codelists
  - title: Spec files (YAML)
    desc: >
      A study's spec as files: one report a file, its `content:` a list of
      items, one function call each; read, layered over the study's
      defaults, checked against the schema, written as code, and converted
      from the workbooks.
    contents:
      - tfl_read_study_spec
      - tfl_read_output
      - tfl_resolve_output
      - tfl_schema
      - tfl_args_to_r
      - tfl_schema_check
      - tfl_schema_help
      - tfl_content_code
      - tfl_content_run
      - tfl_convert_sheets_to_yaml
      - tfl_write_spec_xlsx
      - tfl_import_spec_xlsx
      - tfl_sheets_from_yaml
  - title: Table spec and table plan
    desc: >
      A table as a workbook: its roles and the rtfreporter plan verbs it
      stands for, as a plan (`tfl_table_plan()`) or as code
      (`tfl_table_code()`); a plan written in code back to a workbook.
    contents:
      - tfl_table_spec
      - tfl_table_spec_template
      - tfl_table_plan
      - tfl_normalize_code
      - tfl_table_code
      - tfl_as_table_spec
  - title: Template SPEC
    desc: >
      A report kind from a few parameters: one definition gives the table
      plan (`tpl_*()`, the A use) and the report's items
      (`tfl_template_expand()`, the B use).  Layout templates (`summary`)
      and display templates on them (`demog`).
    contents:
      - tfl_templates
      - tfl_template_expand
      - tpl_demog
      - tpl_summary
  - title: Report spec, titles, footnotes, headers and tokens
    desc: >
      The page, the running header and footer, the titles and footnotes,
      the tokens: the document around a table, a listing or a figure.
    contents:
      - tfl_read_report_spec
      - tfl_report
      - tfl_report_code
      - tfl_report_setup_code
      - tfl_report_tokens
      - tfl_report_path
  - title: Listings
    desc: Two sheets keyed by `output_id`, the pages and the program.
    contents:
      - tfl_listing_spec
      - tfl_listing
      - tfl_listing_code
      - tfl_as_listing_spec
  - title: Figures
    desc: >
      A figure as a YAML design -- its data steps, statistics and layers --
      and the ggplot2 script it stands for.
    contents:
      - tfl_fig_design
      - tfl_fig_content_from_design
      - tfl_fig_forest_analyses
      - tfl_fig_templates
      - tfl_fig_parts
      - tfl_fig_objects
      - tfl_fig_page_size
      - tfl_fig_uses_ard
      - tfl_fig_add_layer
      - tfl_fig_calls
      - tfl_fig_compat
      - tfl_fig_data_name
      - tfl_r
  - subtitle: Figure style
    desc: Every look-and-feel value of a study's figures, in one place.
    contents:
      - tfl_fig_style
      - tfl_fig_setup_code
      - tfl_time_unit_days
      - tfl_fig_palettes
  - subtitle: Figure spec (sheets) and quick figures
    desc: >
      The older sheet-based figure spec and its quick figures, kept while
      the design is decided
      ([Discussion #63](https://github.com/ichirio/tflspec/discussions/63)).
    contents:
      - tfl_fig_spec
      - tfl_fig_spec_template
      - tfl_read_fig_spec
      - tfl_example_fig_spec
      - tfl_fig_code
      - tfl_write_fig_code
      - tfl_fig_schema
      - tfl_fig_types
      - tfl_fig_catalog
      - tfl_fig_list_template
      - tfl_fig_list_code
      - tfl_fig_km
      - tfl_fig_waterfall
      - tfl_fig_swimmer
      - tfl_fig_forest
      - tfl_fig_mean
      - tfl_fig_box
      - tfl_fig_bar
      - tfl_fig_scatter
      - tfl_fig_individual
      - tfl_fig_pk
      - tfl_fig_ae_dot
      - tfl_fig_butterfly
      - tfl_fig_edish
      - tfl_fig_sankey
      - tfl_fig_sunburst
  - subtitle: Sankey diagrams and sunbursts
    contents:
      - tfl_plot_sankey
      - tfl_plot_sankey_batch
      - tfl_sankey_data
      - tfl_plot_sunburst
  - title: CDISC ARS export and import
    desc: >
      The specs as CDISC's Analysis Results Standard (JSON, and CDISC's
      Excel template to read), run by siera; anyone's ARS back as specs.
    contents:
      - tfl_ars
      - tfl_write_ars_json
      - tfl_write_ars_xlsx
      - tfl_ars_unmapped
      - tfl_ars_ard
      - tfl_read_ars_json
      - tfl_ars_to_specs
  - title: The YAML spec (one file a report)
    desc: >
      The study's definition as YAML -- `study.yml`, `spec/data.yml`,
      `spec/defaults.yml`, `spec/patterns/`, `spec/toc.yml`, one
      `spec/outputs/<id>.yml` a report -- its objects, the layering of a
      report over its defaults, the one-time conversion of the sheets, and
      the flat view as a workbook.
    contents:
      - tfl_output
      - tfl_plot
      - tfl_read_output
      - tfl_read_study_spec
      - tfl_resolve_output
      - tfl_convert_sheets_to_yaml
      - tfl_write_spec_xlsx
      - tfl_import_spec_xlsx
  - title: Reading and writing workbooks, the TOC
    desc: >
      Each spec has its own reader and writer; several specs may share one
      workbook. A company's table of contents becomes report specs, and an
      ARD a JSON / YAML / XPT copy.
    contents:
      - tfl_write_ard_spec
      - tfl_read_table_spec
      - tfl_write_table_spec
      - tfl_write_specs
      - tfl_spec_columns
      - tfl_read_toc
      - tfl_write_ard
      - tfl_read_ard
  - title: Checks
    desc: >
      What went wrong, said before a report is made: an ARD and what a
      table reads from it, a function of one's own, the ARS, a figure, a
      report's own code.
    contents:
      - tfl_check_ard
      - tfl_check_code
      - tfl_check_ard_function
      - tfl_ard_conditions
      - tfl_check_ars
      - tfl_fig_advice
      - tfl_check_fig_spec
  - title: Review of the whole definition
    desc: >
      Every report's problems at once, one row each: what cannot be used,
      what is probably wrong and what to set by hand; with the facts of the
      data and of each report's ARD.
    contents:
      - tfl_review_spec
      - tfl_review_rules
      - tfl_review_templates
      - tfl_data_facts
      - tfl_ard_facts
  - title: AI manual and kit
    desc: >
      The manual of the installed version, and the kit to attach to a chat
      that drafts a study's specs from its TOC and shells; each file it
      returns reviewed, what the AI can correct apart from what the person
      decides.
    contents:
      - tflspec_ai_manual
      - tfl_ai_unpack
      - tfl_adam_metadata
      - tfl_ai_review
  - title: AI-assisted drafting
    desc: >
      A prompt for an AI chat that drafts tables' report files (the code
      spec) from a company's TOC / SHELL workbook and an ADaM summary, the
      study's TOC, or a figure design; the answer read and checked by
      tflspec's own checks, and written as files or shown as what it
      changes; nothing is sent anywhere.
    contents:
      - tfl_ai_read_shell
      - tfl_ai_adam_summary
      - tfl_ai_batches
      - tfl_ai_write_requests
      - tfl_ai_collect_answers
      - tfl_ai_study_init
      - tfl_ai_tasks
      - tfl_ai_context
      - tfl_ai_schema
      - tfl_ai_prompt
      - tfl_ai_parse
      - tfl_ai_check
      - tfl_ai_repair_prompt
      - tfl_ai_diff
  - title: Helpers
    contents:
      - tflspec_code_options
      - print.tfl_code
