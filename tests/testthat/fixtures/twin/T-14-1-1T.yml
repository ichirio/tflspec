# T-14-1-1 written as a template SPEC: tflspec_v1/tflspec_summary with the
# arguments that give the code SPEC's report (T-14-1-1C, tflspec's
# inst/extdata/spec-yaml/outputs/T-14-1-1.yml with the canon ids).  The
# decimals are the series' formats (AGE:mean 1, AGE:sd 2, median 1, N, min,
# max 0: the code SPEC's plan_digits); the values' text is the study's code
# lists by name (value_labels, the map the retired demog template had as
# its default); the code SPEC's last card (plan_cell_style) is the report's
# own content, after the template's.
id: T-14-1-1T
kind: table
label: Demographics
common:
  population: SAF
  treatment: TRT01A
codelists:
  TRT01A:
    - {value: Drug X, label: Drug X 200 mg}
    - {value: Control, label: Control 100 mg}
template:
  name: tflspec_v1/tflspec_summary
  analysis:
    by: [TRT01A]
    continuous: [AGE]
    categorical: [AGEGR1, SEX, RACE, ECOGBL]
    missing_row: false
  content:
    labels: {AGE: "Age (years)", AGEGR1: "Age group, n (%)", SEX: "Sex, n (%)", RACE: "Race, n (%)", ECOGBL: "Baseline ECOG, n (%)"}
    value_labels:
      SEX: !r study$codelists$SEX
      RACE: !r study$codelists$RACE
      ETHNIC: !r study$codelists$ETHNIC
      AGEGR1: !r study$codelists$AGEGR1
    cells:
      n: "{N}"
      Mean (SD): "{mean} ({sd})"
      Median: "{median}"
      Min, Max: "{min}, {max}"
    max_rows: 30
content:
  - plan_cell_style: {where: p > 0.5, bold: true}
page:
  titles:
    1: {center: Table 14.1.1}
    2: {center: Demographic Characteristics}
  footnotes:
    1: {left: "SD = Standard Deviation."}
  tokens: {OUTPUT_POPULATION: Safety Analysis Set}
