# T-14-3-1 written as a template SPEC: tflspec_v1/tflspec_hierarchy, whose
# ARD is the code SPEC's (T-14-3-1C: tflplanner's SAMPLE-01 T-14-3-1 with
# the canon ids).  The report gives what the retired ae_soc_pt template
# fixed: the dataset and levels, the records kept (rec_sub's where), the
# ids AE_ANY / AE_L1 / AE_L2, the first row's label and the heading, and
# its row order (SOC by name) as a plan_sort card after the template's;
# and max_rows (22, the series' 30).
id: T-14-3-1T
kind: table
label: TEAEs by SOC / PT
common:
  population: SAF
codelists:
  TRT01A:
    - value: Drug X
    - value: Control
data:
  - id: rec_sub
    where: !r TRTEMFL == "Y"
template:
  name: tflspec_v1/tflspec_hierarchy
  data:
    from: ADAE
  analysis:
    by: [TRT01A]
    hierarchy: [AEBODSYS, AEDECOD]
    analysis_ids: {ANY: AE_ANY, L1: AE_L1, L2: AE_L2}
  content:
    any_row_label: Any TEAE
    heading: [System Organ Class, "   Preferred Term"]
    max_rows: 22
content:
  - plan_sort: {keys: [.overall, group1, .depth, -n, label]}
page:
  footer:
    '1':
      left: Subjects are counted once per system organ class and once per preferred
        term.
  tokens:
    OUTPUT_TITLE: Treatment-Emergent Adverse Events by System Organ Class and Preferred
      Term
    OUTPUT_POPULATION: Safety Analysis Set
style: compact
note: TEAE by SOC / PT, frequency descending
