datasets:
  - dataset: ADSL
    level: ADaM
    path: data/adam/adsl.rds
  - dataset: ADAE
    level: ADaM
    path: data/adam/adae.xpt
    derive: AEDUR = AENDY - ASTDY + 1
  - dataset: ADLB
    level: ADaM
    path: data/adam/adlb.sas7bdat
populations:
  - id: SAF
    dataset: ADSL
    where: !r SAFFL == "Y"
    label: Safety Analysis Set
  - id: ITT
    dataset: ADSL
    where: !r ITTFL == "Y"
    label: Intent-to-Treat Set
